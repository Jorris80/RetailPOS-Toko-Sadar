<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#059669">
<title>Offline — Retail POS</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#0f172a;--muted:#64748b;--brand:#059669}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2b;--ink:#e6edf7;--muted:#94a3b8}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
main{max-width:420px;background:var(--card);border-radius:18px;padding:28px;text-align:center;box-shadow:0 10px 40px -20px #0006}
img{width:72px;height:72px;border-radius:18px}
h1{font-size:20px;margin:14px 0 6px}
p{color:var(--muted);margin:6px 0}
button{margin-top:16px;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="">
  <h1>Anda sedang offline</h1>
  <p>Aplikasi kasir belum sempat tersimpan di perangkat ini. Sambungkan internet sekali untuk memuat aplikasi; setelah itu kasir tetap bisa dipakai tanpa internet.</p>
  <p>Transaksi yang sudah dibuat sebelumnya tetap aman di perangkat dan akan dikirim otomatis saat online.</p>
  <button onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
