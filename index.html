}
/** Ganti placeholder dengan gambar setelah thumbnail tiba (tanpa render ulang halaman). */
function paintThumbs() {
  var pm = prodMap();
  $$('[data-thumb]').forEach(function (el) {
    var t = thumbOf(pm[el.dataset.thumb]);
    if (!t) return;
    var img = el.querySelector('img');
    if (img) { if (img.getAttribute('src') !== t) img.src = t; return; }
    var b = el.querySelector('b'); if (b) b.remove();
    img = document.createElement('img'); img.alt = ''; img.src = t;
    el.insertBefore(img, el.firstChild);
  });
}

/** Ambil thumbnail yang belum ada / versinya berubah, simpan di IndexedDB agar tampil saat offline. */
function syncThumbs() {
  if (!st.boot || !st.token || syncThumbs.busy) return;
  var prods = st.boot.products || [];
  var alive = {};
  prods.forEach(function (p) { if (p.photoVer) alive[p.id] = 1; });
  var changed = false;
  Object.keys(thumbs).forEach(function (id) { if (!alive[id]) { delete thumbs[id]; changed = true; } });
  if (changed) kv.set('thumbs', thumbs);
  if (!st.online || !photosOn()) return;
  var need = prods.filter(function (p) { return p.photoVer && !thumbOf(p); }).map(function (p) { return p.id; });
  if (!need.length) return;
  syncThumbs.busy = true;
  var verOf = {}; prods.forEach(function (p) { verOf[p.id] = p.photoVer; });
  var next = function () {
    var batch = need.splice(0, 60);
    if (!batch.length) { syncThumbs.busy = false; return; }
    api('photos.thumbs', { ids: batch }).then(function (map) {
      Object.keys(map).forEach(function (id) { if (map[id]) thumbs[id] = { v: verOf[id], d: map[id] }; });
      kv.set('thumbs', thumbs);
      paintThumbs();
      next();
    }, function () { syncThumbs.busy = false; });
  };
  next();
}

/* ---------- Kompres gambar di perangkat sebelum diunggah ---------- */
function resizeImage(file, max, quality) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onerror = function () { rej(new Error('Gagal membaca file gambar')); };
    r.onload = function () {
      var img = new Image();
      img.onerror = function () { rej(new Error('File bukan gambar yang valid')); };
      img.onload = function () {
        var s = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
        var g = c.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);   // latar putih untuk PNG transparan
        g.drawImage(img, 0, 0, c.width, c.height);
        res({ canvas: c, url: c.toDataURL('image/jpeg', quality) });
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
/** Hasil: {full: ≤ ±1 MB (800 px), thumb: < 40.000 karakter (240 px)} */
function preparePhoto(file) {
  if (!file || !/^image\//.test(file.type)) return Promise.reject(new Error('Pilih file gambar (JPG/PNG/WebP)'));
  return resizeImage(file, 900, 0.82).then(function (full) {
    var f = full.url;
    if (f.length > 1400000) f = full.canvas.toDataURL('image/jpeg', 0.6);
    var size = 240, q = 0.72, t;
    var tc = document.createElement('canvas');
    do {
      var sc = Math.min(1, size / Math.max(full.canvas.width, full.canvas.height));
      tc.width = Math.round(full.canvas.width * sc); tc.height = Math.round(full.canvas.height * sc);
      var g = tc.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, tc.width, tc.height);
      g.drawImage(full.canvas, 0, 0, tc.width, tc.height);
      t = tc.toDataURL('image/jpeg', q);
      q -= 0.12; if (q < 0.35) { size -= 40; q = 0.6; }
    } while (t.length > 40000 && size > 80);
    return { full: f, thumb: t };
  });
}

/* ---------- Penampil zoom (cubit, scroll, seret, ketuk ganda) ---------- */
function zoomPhoto(pid, opt) {
  opt = opt || {};
  var p = prodMap()[pid] || opt.product;
  if (!p) return;
  var startSrc = opt.src || thumbOf(p);
  var m = modal({
    title: esc(p.name), size: 'xl',
    body: '<div class="zoomer" id="zm">' + (startSrc ? '<img id="zmImg" alt="" draggable="false" src="' + startSrc + '">' : '') + '<div class="zm-msg" id="zmMsg">' + (startSrc ? '' : '<span class="spin"></span>') + '</div>' +
      '<div class="zm-ctl"><button class="btn icon sm" data-zm="-" aria-label="Perkecil">' + ic('minus', 'sm') + '</button><span id="zmPct">100%</span><button class="btn icon sm" data-zm="+" aria-label="Perbesar">' + ic('plus', 'sm') + '</button><button class="btn sm" data-zm="0">Reset</button>' +
        (opt.nav && opt.nav.total > 1 ? '<span class="zm-sep"></span><button class="btn icon sm" data-zn="-1" aria-label="Foto sebelumnya">' + ic('chevl', 'sm') + '</button><span>' + (opt.nav.index + 1) + '/' + opt.nav.total + '</span><button class="btn icon sm" data-zn="1" aria-label="Foto berikutnya">' + ic('chevr', 'sm') + '</button>' : '') + '</div></div>' +
      (opt.bare ? (opt.caption ? '<div class="faint mt" style="font-size:12.5px">' + esc(opt.caption) + '</div>' : '') : '<div class="row between mt"><div><b>' + rp(p.price) + '</b> <span class="faint">/ ' + esc(p.unit || '') + ' · stok ' + qtyFmt(p.stock) + ' · ' + esc(p.sku || '') + '</span></div>' +
      (opt.onAdd ? '<button class="btn primary" id="zmAdd">' + ic('plus') + 'Tambah ke keranjang</button>' : '') + '</div>') +
      '<div class="faint" style="font-size:12px;margin-top:6px">Cubit / scroll untuk zoom, seret untuk menggeser, ketuk dua kali untuk perbesar cepat.</div>'
  });
  var box = m.$('#zm'), S = { s: 1, x: 0, y: 0 }, pts = {}, pinch = null, last = null, lastTap = 0;
  var img = function () { return m.$('#zmImg'); };
  var clamp = function () {
    S.s = Math.max(1, Math.min(6, S.s));
    var w = box.clientWidth, h = box.clientHeight;
    var mx = (S.s - 1) * w / 2, my = (S.s - 1) * h / 2;
    S.x = Math.max(-mx, Math.min(mx, S.x)); S.y = Math.max(-my, Math.min(my, S.y));
    if (S.s === 1) { S.x = 0; S.y = 0; }
  };
  var apply = function () {
    clamp();
    var i = img(); if (i) i.style.transform = 'translate(' + S.x + 'px,' + S.y + 'px) scale(' + S.s + ')';
    m.$('#zmPct').textContent = Math.round(S.s * 100) + '%';
    box.style.cursor = S.s > 1 ? 'grab' : 'zoom-in';
  };
  var zoomAt = function (factor, cx, cy) {
    var r = box.getBoundingClientRect();
    var ox = (cx === undefined ? r.width / 2 : cx - r.left) - r.width / 2, oy = (cy === undefined ? r.height / 2 : cy - r.top) - r.height / 2;
    var ns = Math.max(1, Math.min(6, S.s * factor)), k = ns / S.s;
    S.x = ox - (ox - S.x) * k; S.y = oy - (oy - S.y) * k; S.s = ns;
    apply();
  };
  box.addEventListener('wheel', function (e) { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX, e.clientY); }, { passive: false });
  box.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.zm-ctl')) return;          // tombol +/−/reset bukan gestur
    box.setPointerCapture(e.pointerId);
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pts);
    if (ids.length === 2) { var a = pts[ids[0]], b = pts[ids[1]]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: S.s }; }
    last = { x: e.clientX, y: e.clientY };
    var now = Date.now();
    if (ids.length === 1 && now - lastTap < 300) { if (S.s > 1) { S.s = 1; apply(); } else zoomAt(2.5, e.clientX, e.clientY); lastTap = 0; }
    else lastTap = now;
  });
  box.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pts);
    if (ids.length === 2 && pinch) {
      var a = pts[ids[0]], b = pts[ids[1]];
      var target = pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / (pinch.d || 1);
      zoomAt(target / S.s, (a.x + b.x) / 2, (a.y + b.y) / 2);
    } else if (ids.length === 1 && last && S.s > 1) {
      S.x += e.clientX - last.x; S.y += e.clientY - last.y; last = { x: e.clientX, y: e.clientY }; apply();
    }
  });
  var up = function (e) { delete pts[e.pointerId]; if (Object.keys(pts).length < 2) pinch = null; last = null; };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  m.$$('[data-zm]').forEach(function (b) { b.onclick = function () { var k = b.dataset.zm; if (k === '0') { S.s = 1; apply(); } else zoomAt(k === '+' ? 1.4 : 1 / 1.4); }; });
  var add = m.$('#zmAdd'); if (add) add.onclick = function () { opt.onAdd(); m.close(); };
  if (opt.nav && opt.nav.total > 1) {
    var nav = function (d) { var i = (opt.nav.index + d + opt.nav.total) % opt.nav.total; m.close(); opt.nav.go(i); };
    m.$$('[data-zn]').forEach(function (b) { b.onclick = function () { nav(Number(b.dataset.zn)); }; });
    var kd = function (e) { if (!document.body.contains(box)) return document.removeEventListener('keydown', kd); if (e.key === 'ArrowRight') nav(1); if (e.key === 'ArrowLeft') nav(-1); };
    document.addEventListener('keydown', kd);
    // usap kiri/kanan saat tidak diperbesar
    var sx = null;
    box.addEventListener('pointerdown', function (e) { if (S.s === 1) sx = e.clientX; });
    box.addEventListener('pointerup', function (e) { if (sx !== null && S.s === 1 && Math.abs(e.clientX - sx) > 60) nav(e.clientX < sx ? 1 : -1); sx = null; });
  }
  var setSrc = function (src) {
    var i = img();
    if (!i) { i = document.createElement('img'); i.id = 'zmImg'; i.alt = ''; i.draggable = false; box.insertBefore(i, box.firstChild); }
    i.src = src; m.$('#zmMsg').innerHTML = ''; apply();
  };
  apply();
  if (opt.loader) {
    if (startSrc) m.$('#zmMsg').innerHTML = '<span class="zm-note"><span class="spin"></span> memuat ukuran penuh…</span>';
    opt.loader().then(function (d) { if (document.body.contains(box)) setSrc(d); }, function (e) { m.$('#zmMsg').innerHTML = '<span class="zm-note">' + esc(e.message) + '</span>'; });
    return;
  }
  if (opt.src || !p.photoVer) { if (!startSrc) m.$('#zmMsg').innerHTML = '<span>Belum ada foto</span>'; return; }
  // foto penuh: dari cache perangkat, atau unduh sekali lalu simpan (bisa dilihat offline berikutnya)
  var key = 'photo:' + pid;
  kv.get(key).then(function (c) {
    if (c && String(c.v) === String(p.photoVer)) return setSrc(c.d);
    if (!st.online) { m.$('#zmMsg').innerHTML = startSrc ? '<span class="zm-note">Offline — menampilkan foto kecil</span>' : '<span>Offline — foto belum tersimpan di perangkat</span>'; return; }
    if (startSrc) m.$('#zmMsg').innerHTML = '<span class="zm-note"><span class="spin"></span> memuat foto penuh…</span>';
    api('photos.full', { productId: pid }).then(function (r) {
      kv.set(key, { v: r.photoVer, d: r.data });
      if (document.body.contains(box)) setSrc(r.data);
    }, function (e) { m.$('#zmMsg').innerHTML = '<span class="zm-note">' + esc(e.message) + '</span>'; });
  });
}

function photoEditorHtml(p) {

}
/** Mengikat kontrol foto; mengembalikan fungsi commit(productId) yang dipanggil setelah produk tersimpan. */
function bindPhotoEditor(m, p) {
  var pending = null;   // {full, thumb} | {remove:true} | null
  var prev = m.$('#pePrev'), msg = m.$('#peMsg');
  m.$('#peFile').onchange = function () {
    var f = this.files[0]; if (!f) return;
    msg.textContent = 'Memproses foto…';
    preparePhoto(f).then(function (ph) {
      pending = ph;
      prev.innerHTML = '<img alt="" src="' + ph.thumb + '">';
      m.$('#peZoom').disabled = false; m.$('#peDel').disabled = false;
      msg.textContent = 'Foto baru siap (' + Math.round(ph.full.length * 0.75 / 1024) + ' KB). Tersimpan saat menekan Simpan.';
    }, function (e) { msg.textContent = e.message; });
  };
  m.$('#peZoom').onclick = function () {
    if (pending && pending.full) zoomPhoto(p.id || 'baru', { product: Object.assign({ name: m.$('[name=name]').value || 'Produk baru', price: num(m.$('[name=price]').value) }, p), src: pending.full });
    else if (p.id) zoomPhoto(p.id);
  };
  prev.onclick = function () { if (!m.$('#peZoom').disabled) m.$('#peZoom').click(); };
  m.$('#peDel').onclick = function () {
    pending = p.photoVer ? { remove: true } : null;
    prev.innerHTML = '<span>' + ic('image', 'lg') + '<br>Belum ada foto</span>';
    m.$('#peZoom').disabled = true; m.$('#peDel').disabled = true;
    msg.textContent = p.photoVer ? 'Foto akan dihapus saat menekan Simpan.' : '';
  };
  return function commit(productId) {
    if (!pending) return Promise.resolve(null);
    var payload = Object.assign({ productId: productId }, pending);
    return api('photos.save', payload).then(function (r) {
      var prod = prodMap()[productId];
      if (prod) { prod.photoId = r.photoId; prod.photoVer = r.photoVer; }
      if (pending.remove) { delete thumbs[productId]; kv.del('photo:' + productId); }
      else { thumbs[productId] = { v: r.photoVer, d: pending.thumb }; kv.set('photo:' + productId, { v: r.photoVer, d: pending.full }); }
      kv.set('thumbs', thumbs); saveBootCache();
      return r;
    });
  };
}

/* ---------- Daftar satuan (disimpan di Pengaturan, bisa ditambah/dihapus) ---------- */
function unitList() {
  var base = String(st.boot.settings.units || 'PCS').split(',').map(function (u) { return u.trim(); }).filter(Boolean);
  (st.boot.products || []).forEach(function (p) { var u = String(p.unit || '').toUpperCase(); if (u && base.indexOf(u) < 0) base.push(u); });
  return base;
}
function unitOptions(sel) {
  var list = unitList();
  sel = String(sel || '').toUpperCase();
  if (sel && list.indexOf(sel) < 0) list.push(sel);
  return list.map(function (u) { return '<option value="' + esc(u) + '"' + (u === sel ? ' selected' : '') + '>' + esc(u) + '</option>'; }).join('') +
    (can('settings.manage') ? '<option value="__new">+ Satuan baru…</option>' : '');
}
function saveUnits(list) {
  return api('settings.save', { units: list.join(',') }).then(function (s) { st.boot.settings = s; saveBootCache(); return s; });
}
function cleanUnit(u) { return String(u || '').trim().toUpperCase().replace(/\s+/g, ''); }
function addUnit() {
  return new Promise(function (res) {
    var m = modal({
      title: 'Satuan Baru', body: '<label class="f">Nama satuan (maks. 10 karakter, tanpa spasi)<input class="input" id="nuV" maxlength="10" placeholder="mis. KARTON, IKAT, SACHET" autofocus autocapitalize="characters"></label><p class="faint" style="font-size:12.5px">Satuan baru tersimpan di daftar dan bisa dipakai untuk produk lain.</p>',
      foot: '<button class="btn" data-close>Batal</button><button class="btn primary" id="nuOk">Tambah</button>', onClose: function (v) { res(v || null); }
    });
    var go = function () {
      var u = cleanUnit(m.$('#nuV').value);
      if (!/^[A-Z0-9.\/-]{1,10}$/.test(u)) return toast('Satuan hanya huruf/angka, maks. 10 karakter', 'bad');
      var list = String(st.boot.settings.units || '').split(',').filter(Boolean);
      if (list.indexOf(u) >= 0) return m.close(u);
      run(m.$('#nuOk'), saveUnits(list.concat([u])), 'Satuan ' + u + ' ditambahkan').then(function () { m.close(u); });
    };
    m.$('#nuOk').onclick = go;
    m.$('#nuV').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  });
}
function manageUnits() {
  return new Promise(function (res) {
    var list = String(st.boot.settings.units || '').split(',').filter(Boolean);
    var used = {};
    (st.boot.products || []).forEach(function (p) { var u = String(p.unit || '').toUpperCase(); used[u] = (used[u] || 0) + 1; });
    var m = modal({
      title: 'Daftar Satuan',
      body: '<div class="chips" id="muL" style="flex-wrap:wrap"></div><div class="row mt"><input class="input" id="muV" maxlength="10" placeholder="Satuan baru"><button class="btn" id="muAdd">' + ic('plus') + 'Tambah</button></div><p class="faint" style="font-size:12.5px">Satuan yang sedang dipakai produk tidak bisa dihapus.</p>',
      foot: '<button class="btn" data-close>Batal</button>' + (can('settings.manage') ? '<button class="btn primary" id="muOk">Simpan</button>' : ''),
      onClose: function () { res(); }
    });
    var draw = function () {
      m.$('#muL').innerHTML = list.map(function (u, i) {
        return '<span class="chip" style="cursor:default">' + esc(u) + (used[u] ? ' <span class="faint">(' + used[u] + ')</span>' : ' <a href="#" data-x="' + i + '" style="color:var(--bad);text-decoration:none;margin-left:4px">×</a>') + '</span>';

    var ok = m.$('#muOk'); if (ok) ok.onclick = function () { run(ok, saveUnits(list), 'Daftar satuan disimpan').then(function () { m.close(); }); };
    draw();
  });
}

function validEan13(c) {
  if (!/^\d{13}$/.test(c)) return false;
  var s = 0; for (var i = 0; i < 12; i++) s += Number(c[i]) * (i % 2 ? 3 : 1);
  return (10 - s % 10) % 10 === Number(c[12]);
}

  m.$('#lQ').oninput = debounce(draw, 150); draw(); cnt();

/** Satu pembayaran bisa dialokasikan ke beberapa dokumen (FIFO) → gabungkan per payId agar bukti tampil sekali. */
function payGroups(rows) {
  var out = [], by = {};
  rows.forEach(function (r) {
    var k = r.type === 'PAY' && r.payId ? r.payId : r.id;
    if (by[k]) { by[k].amount = Number(by[k].amount) + Number(r.amount); by[k].parts++; return; }
    by[k] = Object.assign({}, r, { amount: Number(r.amount), parts: 1 }); out.push(by[k]);
  });
  return out;
}

        '<label class="f">Tanggal bayar<input class="input" type="date" id="dyDt" value="' + today() + '" max="' + today() + '" min="' + payDateMin(o) + '"></label></div>' +
        '<div class="faint" id="dyHint" style="font-size:12px;margin-top:4px"></div>' +
        '<div class="grid2 mt"><label class="f">No. referensi / bukti<input class="input" id="dyR"></label><label class="f">Catatan<input class="input" id="dyN"></label></div>' +
        '<div class="mt">' + attachPickerHtml() + '</div>',
      foot: '<button class="btn" data-close>Batal</button><button class="btn primary" id="dyOk">' + ic('check') + 'Simpan</button>',
      onClose: function (v) { resolve(v || null); }
    });
    var hint = function () {
      var cash = m.$('#dyM').value === 'CASH', dt = m.$('#dyDt').value;
      if (dt && dt !== today()) {
        m.$('#dyHint').innerHTML = '<span style="color:var(--warn)">' + ic('calendar', 'sm') + ' Tanggal mundur ' + fmtD(dt) + ': dicatat di jurnal &amp; laporan pada tanggal itu' + (cash ? ', <b>tidak</b> menambah/mengurangi kas laci shift sekarang' : '') + '. Tercatat di log audit.</span>';
        return;
      }
      m.$('#dyHint').innerHTML = cash ? (shiftHere ? 'Uang ' + (kind === 'AR' ? 'masuk ke' : 'diambil dari') + ' laci shift ' + esc(st.shift.register) + ' — tercatat di laporan shift.' : '<span style="color:var(--warn)">Tidak ada shift terbuka di perangkat ini; dicatat sebagai kas toko tanpa shift.</span>') : '';
    };
    m.$('#dyM').onchange = hint; m.$('#dyDt').onchange = m.$('#dyDt').oninput = hint; hint();
    var picker = bindAttachPicker(m);
    m.$$('[data-p]').forEach(function (b) { b.onclick = function () { m.$('#dyA').value = Math.round(o.outstanding * Number(b.dataset.p)); }; });
    m.$('#dyOk').onclick = function () {
      if (picker.busy()) return toast('Tunggu, lampiran masih diproses…', 'warn');
      var atts = picker.items();
      var amt = Math.round(num(m.$('#dyA').value));
      if (amt <= 0) return toast('Isi nominal', 'bad');
      if (amt > o.outstanding) return toast('Melebihi sisa ' + debtWord(kind) + ' ' + rp(o.outstanding), 'bad');
      var method = m.$('#dyM').value;
      var payDate = m.$('#dyDt').value || today();
      if (payDate > today()) return toast('Tanggal bayar tidak boleh melewati hari ini', 'bad');
      if (payDate < payDateMin(o)) return toast('Tanggal bayar paling awal ' + fmtD(payDateMin(o)), 'bad');
      var back = payDate !== today();
      var data = {
        id: uuid(), kind: kind, partyId: o.partyId || '', partyName: o.partyName, debtId: o.debtId || '', amount: amt, method: method,
        ref: m.$('#dyR').value.trim(), notes: m.$('#dyN').value.trim(), outletId: st.outletId, shiftId: method === 'CASH' && shiftHere && !back ? st.shift.id : '', date: payDate,
        ts: new Date().toISOString(), userName: st.user.fullName, docNo: kind === 'AR' ? nextKwitansiNo() : '', attCount: atts.length
      };
      var applyLocal = function () {
        if (method === 'CASH' && shiftHere && !back) {
          if (kind === 'AR') st.shift.cashIn = (Number(st.shift.cashIn) || 0) + amt; else st.shift.cashOut = (Number(st.shift.cashOut) || 0) + amt;
          kv.set('shift', st.shift);
        }
        if (kind === 'AR') (st.boot.customers || []).forEach(function (c) { if (c.id === o.partyId) c.arBalance = Math.max(0, (Number(c.arBalance) || 0) - amt); });
        saveBootCache();
      };
      var done = function (offline) {
        applyLocal();
        var fin = function (ar) {
          toast((kind === 'AR' ? 'Pembayaran diterima ' : 'Hutang dibayar ') + rp(amt) + (atts.length ? ' + ' + atts.length + ' bukti' : '') + (offline || (ar && ar.queued) ? ' — tersimpan offline, dikirim saat online' : ''), 'ok', 4000);
          m.close(data);
          if (kind === 'AR') showKwitansi(data, o);
        };
        if (!atts.length) return fin();
        var ok = m.$('#dyOk'); ok.disabled = true; ok.innerHTML = '<span class="spin"></span> Mengunggah bukti…';
        uploadAttachments(data.id, atts, offline).then(fin);
      };
      // piutang tunai/nontunai dari kasir boleh offline (antrean); hutang selalu online
      if (kind === 'AR' && (!st.online)) { enqueue('debt.pay', data); return done(true); }
      run(m.$('#dyOk'), api('debt.pay', data)).then(function (r) { data.docNo = r.docNo; done(false); }, function (e) {
        if (e.network && kind === 'AR') { enqueue('debt.pay', data); done(true); }
      });
    };
  });
}

/* ===================== Bukti pembayaran: foto langsung & unggah dokumen ===================== */
var ATT_MAX_FILES = 6;                 // per pembayaran (sama dengan batas server)
var ATT_MAX_PDF = 3 * 1024 * 1024;     // 3 MB
var ATT_MAX_IMG_IN = 25 * 1024 * 1024; // file gambar mentah sebelum dikompres

function fmtKB(n) { n = Number(n) || 0; return n >= 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

/** Thumbnail JPEG < 40.000 karakter dari canvas (aman untuk sel Sheets). */

    var g = tc.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, tc.width, tc.height);

/** Canvas → lampiran JPEG (maks 1600 px, ± ≤ 1 MB) */

/** File dari input → lampiran. Gambar dikompres di perangkat; PDF dikirim apa adanya (maks 3 MB). */
function fileToAttachment(file, source) {

  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '')) {
    if (file.size > ATT_MAX_PDF) return Promise.reject(new Error('PDF "' + file.name + '" ' + fmtKB(file.size) + ' — maksimal 3 MB. Kompres dulu atau foto halamannya.'));
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onerror = function () { rej(new Error('Gagal membaca ' + file.name)); };
      r.onload = function () {

      };
      r.readAsDataURL(file);
    });

  if (file.size > ATT_MAX_IMG_IN) return Promise.reject(new Error('Gambar terlalu besar (' + fmtKB(file.size) + ').'));

}

/* ---------- Kamera langsung ---------- */
function liveCameraOk() { return !IS_GAS && window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia; }
/** Membuka kamera di dalam aplikasi; hasil: lampiran (atau null bila batal). */
function openCameraCapture(title) {
  return new Promise(function (resolve) {
    var stream = null, facing = 'environment', shot = null, result = null;
    var m = modal({
      title: ic('camera') + ' ' + esc(title || 'Foto bukti pembayaran'), size: 'wide', sticky: true,
      body: '<div class="cam"><video id="camV" autoplay playsinline muted></video><canvas id="camC" hidden></canvas><div class="cam-msg" id="camMsg"><span class="spin"></span> Membuka kamera…</div></div>' +
        '<div class="faint center" style="font-size:12px;margin-top:6px" id="camTip">Arahkan kamera ke struk transfer, nota, atau uang yang diterima.</div>',
      foot: '<button class="btn" id="camFlip" title="Ganti kamera depan/belakang">' + ic('flip') + '<span class="hide-sm">Ganti kamera</span></button>' +
        '<button class="btn" id="camRetake" hidden>' + ic('refresh') + 'Ulangi</button>' +
        '<button class="btn primary grow" id="camShot" disabled>' + ic('camera') + 'Ambil foto</button><button class="btn primary grow" id="camUse" hidden>' + ic('check') + 'Pakai foto</button>',
      onClose: function () { stop(); resolve(result); }
    });
    var v = m.$('#camV'), msg = m.$('#camMsg');
    function stop() { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    function start() {
      stop(); msg.hidden = false; msg.innerHTML = '<span class="spin"></span> Membuka kamera…'; m.$('#camShot').disabled = true;
      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }).then(function (s) {
        if (!document.body.contains(v)) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
        stream = s; v.srcObject = s; msg.hidden = true; m.$('#camShot').disabled = false;
      }, function (e) {
        msg.innerHTML = '<div><b>Kamera tidak dapat dibuka.</b><br><span style="font-size:12.5px">' + esc(e && e.name === 'NotAllowedError' ? 'Izin kamera ditolak. Izinkan kamera untuk situs ini di setelan browser.' : (e && e.message) || 'Perangkat tidak memiliki kamera.') + '</span><br><label class="btn sm mt">' + ic('image', 'sm') + 'Pakai kamera bawaan HP<input type="file" accept="image/*" capture="environment" id="camAlt" hidden></label></div>';
        m.$('#camAlt').onchange = function () {
          var f = this.files[0]; if (!f) return;
          fileToAttachment(f, 'camera').then(function (a) { result = a; m.close(); }, function (er) { toast(er.message, 'bad'); });
        };
      });
    }
    m.$('#camShot').onclick = function () {
      if (!v.videoWidth) return;
      var c = m.$('#camC'); c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext('2d').drawImage(v, 0, 0);
      shot = c; v.pause(); v.classList.add('frozen');
      m.$('#camShot').hidden = true; m.$('#camUse').hidden = false; m.$('#camRetake').hidden = false; m.$('#camFlip').hidden = true;
    };
    m.$('#camRetake').onclick = function () {
      shot = null; v.play(); v.classList.remove('frozen');
      m.$('#camShot').hidden = false; m.$('#camUse').hidden = true; m.$('#camRetake').hidden = true; m.$('#camFlip').hidden = false;
    };
    m.$('#camUse').onclick = function () {
      if (!shot) return;
      var p = dparts();
      result = canvasToAttachment(shot, 'foto-' + p.year + p.month + p.day + '-' + p.hour + p.minute + p.second + '.jpg', 'camera');
      m.close();
    };
    m.$('#camFlip').onclick = function () { facing = facing === 'environment' ? 'user' : 'environment'; start(); };
    start();
  });
}

/** Mengikat pemilih di dalam modal m; mengembalikan {items(), busy()} */
function bindAttachPicker(m) {
  var items = [], working = 0;
  var msg = m.$('#attMsg');
  var draw = function () {
    m.$('#attL').innerHTML = items.map(function (a, i) { return attTileHtml(a, i, true); }).join('');
    msg.textContent = items.length ? items.length + ' lampiran · ' + fmtKB(items.reduce(function (s, a) { return s + a.size; }, 0)) + ' — dikirim bersama pembayaran' + (st.online ? '' : ' (antre offline)') : '';

    $$('[data-rm]', box).forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); items.splice(Number(b.dataset.rm), 1); draw(); }; });
    $$('[data-ai]', box).forEach(function (t) { t.onclick = function () { viewAttachment(items[Number(t.dataset.ai)]); }; });

    working++; msg.innerHTML = '<span class="spin"></span> Memproses…';

/** Kirim lampiran setelah pembayaran tercatat. Offline / jaringan putus → masuk antrean (berurutan setelah pembayarannya). */
function uploadAttachments(payId, list, forceQueue) {
  var res = { sent: 0, queued: 0, failed: [] };
  return list.reduce(function (p, a) {
    return p.then(function () {
      var payload = { id: a.id, refType: 'DEBTPAY', refId: payId, name: a.name, mime: a.mime, size: a.size, data: a.data, thumb: a.thumb, source: a.source, ts: a.ts, userName: st.user.fullName };
      var queue = function () { res.queued++; return enqueue('attach', payload); };
      if (forceQueue || !st.online) return queue();
      return api('attach.save', payload, { timeout: 90000 }).then(function () { res.sent++; kv.set('att:' + a.id, { d: a.data }); }, function (e) {
        if (e.network) return queue();

    });
  }, Promise.resolve()).then(function () {

  });
}

/* ---------- Melihat lampiran ---------- */
function attachData(a) {

    if (c && c.d) return c.d;
    if (!st.online) throw new Error('Offline — lampiran belum tersimpan di perangkat ini.');

}

  var go = function (d) { var i = Math.max(0, Math.min(photos.length - 1, idx() + d)); tr.scrollTo({ left: i * tr.clientWidth, behavior: 'smooth' }); };

/* ---------- Pilih titik lokasi (outlet / alamat pembeli) ---------- */
/** Mengembalikan Promise {lat,lng,address?} atau null. Cari alamat (OpenStreetMap Nominatim), GPS, tempel tautan Google Maps. */
function pickLocation(init, opt) {
  opt = opt || {};
  return new Promise(function (resolve) {
    var res = null, mk = null, map = null;
    var m = modal({
      title: ic('pin') + ' ' + esc(opt.title || 'Pilih lokasi di peta'), size: 'wide', sticky: true,
      body: '<div class="row" style="gap:6px"><input class="input grow" id="plQ" placeholder="Cari alamat / tempat, atau tempel tautan Google Maps / koordinat"><button class="btn" id="plGo">' + ic('search') + '</button><button class="btn" id="plMe" title="Lokasi saya">' + ic('target') + '</button></div>' +
        '<div id="plR" class="pl-res"></div><div class="map-host pick"><div class="map-canvas" id="plMap"><div class="loading"><span class="spin"></span></div></div></div>' +
        '<div class="faint mt" id="plInfo" style="font-size:12.5px">Ketuk peta atau seret penanda ke titik yang tepat.</div>',
      foot: (init && init.lat !== '' && init.lat !== undefined && opt.clearable ? '<button class="btn ghost" id="plClear">Hapus lokasi</button>' : '') + '<button class="btn" data-close>Batal</button><button class="btn primary" id="plOk" disabled>' + ic('check') + 'Pakai titik ini</button>',
      onClose: function (v) { resolve(v === undefined ? null : v); }
    });
    var set = function (lat, lng, label) {
      lat = Math.round(lat * 1e6) / 1e6; lng = Math.round(lng * 1e6) / 1e6;
      res = { lat: lat, lng: lng, address: label || (res && res.address) || '' };
      if (!mk) { mk = L.marker([lat, lng], { draggable: true }).addTo(map); mk.on('dragend', function () { var p = mk.getLatLng(); set(p.lat, p.lng); }); }
      else mk.setLatLng([lat, lng]);
      m.$('#plInfo').innerHTML = ic('pin', 'sm') + ' <span class="mono">' + lat + ', ' + lng + '</span>' + (res.address ? ' · ' + esc(res.address) : '');
      m.$('#plOk').disabled = false;
    };
    var parseLL = function (t) {
      var mm = /(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/.exec(t) || /@(-?\d+\.\d+),(-?\d+\.\d+)/.exec(t) || /[?&](?:q|ll|query)=(-?\d+\.\d+),(-?\d+\.\d+)/.exec(t);
      return mm ? [Number(mm[1]), Number(mm[2])] : null;
    };
    mapLoad().then(function () {
      m.$('#plMap').innerHTML = '';
      var has = init && init.lat !== '' && init.lat !== undefined && init.lat !== null;
      map = mapCreate(m.$('#plMap'), { center: has ? [Number(init.lat), Number(init.lng)] : (opt.center || MAP_DEFAULT_CENTER), zoom: has ? 17 : (opt.center ? 13 : 5) });
      if (has) set(Number(init.lat), Number(init.lng), init.address);
      map.on('click', function (e) { set(e.latlng.lat, e.latlng.lng); });
      setTimeout(function () { map.invalidateSize(); }, 250);
    }, function () { m.$('#plMap').innerHTML = '<div class="empty">Peta butuh internet. Anda tetap bisa menempel koordinat lalu tekan cari.</div>'; });
    var search = function () {
      var q = m.$('#plQ').value.trim(); if (!q) return;
      var ll = parseLL(q);
      if (ll) { if (map) map.setView(ll, 17); set(ll[0], ll[1]); return; }
      m.$('#plR').innerHTML = '<span class="spin"></span>';
      fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=id&accept-language=id&q=' + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (list) {
        m.$('#plR').innerHTML = list.length ? list.map(function (x, i) { return '<button type="button" class="pl-hit" data-i="' + i + '">' + ic('pin', 'sm') + '<span>' + esc(x.display_name) + '</span></button>'; }).join('') : '<div class="faint">Tidak ditemukan. Coba nama jalan + kota, atau ketuk langsung di peta.</div>';
        m.$$('.pl-hit').forEach(function (b) { b.onclick = function () { var x = list[Number(b.dataset.i)]; map.setView([Number(x.lat), Number(x.lon)], 17); set(Number(x.lat), Number(x.lon), x.display_name); m.$('#plR').innerHTML = ''; }; });
      }, function () { m.$('#plR').innerHTML = '<div class="faint">Pencarian alamat gagal (perlu internet). Ketuk langsung di peta.</div>'; });
    };
    m.$('#plGo').onclick = search;
    m.$('#plQ').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); search(); } };
    m.$('#plMe').onclick = function () {
      if (!navigator.geolocation) return toast('Perangkat tidak mendukung lokasi', 'bad');
      m.$('#plInfo').innerHTML = '<span class="spin"></span> Mencari lokasi…';
      navigator.geolocation.getCurrentPosition(function (p) { if (map) map.setView([p.coords.latitude, p.coords.longitude], 18); set(p.coords.latitude, p.coords.longitude); },
        function () { m.$('#plInfo').textContent = 'Lokasi tidak tersedia. Izinkan akses lokasi atau ketuk peta.'; }, { enableHighAccuracy: true, timeout: 12000 });
    };
    m.$('#plOk').onclick = function () { m.close(res); };
    var cl = m.$('#plClear'); if (cl) cl.onclick = function () { m.close({ lat: '', lng: '' }); };
  });
}

/** Pemeriksa kesiapan instal: menampilkan setiap syarat beserta hasilnya. */
function runPwaCheck() {
  var m = modal({ title: 'Cek kesiapan instal aplikasi', size: 'wide', body: '<div id="pcL"><div class="loading"><span class="spin"></span> Memeriksa…</div></div>' });
  var rows = [];
  var add = function (ok, label, detail) { rows.push({ ok: ok, label: label, detail: detail || '' }); };
  var u = uaInfo();
  add(!IS_GAS, 'Dibuka dari GitHub Pages (bukan URL Apps Script)', IS_GAS ? 'URL Apps Script tidak dapat diinstal. Buka alamat github.io.' : location.origin + location.pathname);
  add(window.isSecureContext, 'Koneksi aman (HTTPS)', location.protocol);
  add(!u.inApp, 'Dibuka di browser utama', u.inApp ? 'Terdeteksi browser dalam aplikasi lain — buka di Chrome.' : '');
  if (u.android) add(u.chrome, 'Browser Google Chrome', u.chrome ? '' : 'Gunakan Chrome agar terpasang sebagai aplikasi (WebAPK).');
  var linkEl = document.querySelector('link[rel="manifest"]');
  add(!!linkEl, 'Tautan manifest di halaman', linkEl ? linkEl.href : 'tidak ditemukan');
  var p1 = linkEl ? fetch(linkEl.href, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (j) {
    var base = linkEl.href;
    var start = new URL(j.start_url || '.', base).href, scope = new URL(j.scope || '.', base).href;
    add(!!(j.name || j.short_name), 'Nama aplikasi', j.short_name || j.name);
    add(['standalone', 'fullscreen', 'minimal-ui'].indexOf(j.display) >= 0, 'Mode tampilan', j.display);
    add(start.indexOf(scope) === 0, 'start_url berada di dalam scope', start + ' ⊂ ' + scope);
    add(new URL(start).origin === location.origin, 'start_url satu domain dengan halaman', start);
    var icon = (j.icons || []).filter(function (i) { return /png/.test(i.type || i.src); })[0];
    if (!icon) { add(false, 'Ikon PNG di manifest', 'tidak ada'); return; }
    return new Promise(function (res) {
      var img = new Image();
      img.onload = function () { add(img.naturalWidth >= 192 && img.naturalWidth === img.naturalHeight, 'Ikon dapat dimuat, persegi, ≥192 px', img.naturalWidth + '×' + img.naturalHeight); res(); };
      img.onerror = function () { add(false, 'Ikon dapat dimuat', new URL(icon.src, base).href + ' gagal dimuat — pastikan icon-512.png ikut diunggah'); res(); };
      img.src = new URL(icon.src, base).href;
    });
  }).catch(function (e) { add(false, 'manifest.json dapat dibaca', e.message + ' — pastikan manifest.json ikut diunggah ke repositori yang sama'); }) : Promise.resolve();
  var p2 = ('serviceWorker' in navigator) ? navigator.serviceWorker.getRegistration().then(function (r) {
    add(!!(r && r.active), 'Service worker aktif', r ? r.scope : (pwaState.swError || 'belum terdaftar — muat ulang halaman'));
    add(!!navigator.serviceWorker.controller, 'Halaman dikendalikan service worker (siap offline)', navigator.serviceWorker.controller ? '' : 'muat ulang halaman sekali');
  }) : Promise.resolve(add(false, 'Browser mendukung service worker', 'tidak didukung'));
  Promise.all([p1, p2]).then(function () {
    add(true, 'Status pemasangan', isStandalone() ? 'Sedang berjalan sebagai aplikasi terpasang ✔' : (pwaState.prompt ? 'Siap — tekan "Instal sekarang"' : (ls.get('pwaInstalledAt') ? 'Pernah dipasang ' + fmtDT(ls.get('pwaInstalledAt')) : 'Tombol instal dari Chrome belum tersedia (bisa karena sudah terpasang atau perangkat membatasi)')));
    var bad = rows.filter(function (r) { return !r.ok; }).length;
    m.$('#pcL').innerHTML = '<div class="alert ' + (bad ? 'warn' : 'ok') + ' mb">' + (bad ? bad + ' syarat belum terpenuhi — perbaiki yang bertanda ✘.' : 'Semua syarat teknis terpenuhi. Bila tetap "Aplikasi tidak dapat dibuka", ikuti langkah di "Cara instal".') + '</div>' +
      '<div class="tbl-wrap"><table class="tbl"><tbody>' + rows.map(function (r) {
        return '<tr><td style="width:28px;color:' + (r.ok ? 'var(--ok)' : 'var(--bad)') + ';font-weight:800">' + (r.ok ? '✔' : '✘') + '</td><td><b>' + esc(r.label) + '</b>' + (r.detail ? '<div class="faint mono" style="font-size:11.5px;word-break:break-all">' + esc(r.detail) + '</div>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div><div class="faint mt" style="font-size:11.5px;word-break:break-all">' + esc(navigator.userAgent) + '</div>';
    var foot = document.createElement('div'); foot.className = 'md-f';
    foot.innerHTML = '<button class="btn" id="pcHelp">Cara instal</button>' + (pwaState.prompt ? '<button class="btn primary" id="pcInst">' + ic('download') + 'Instal sekarang</button>' : '');
    m.el.querySelector('.md').appendChild(foot);
    m.$('#pcHelp').onclick = function () { m.close(); showInstallHelp(); };
    var ib = m.$('#pcInst'); if (ib) ib.onclick = function () { m.close(); installApp(); };
  });
}

function bindImgPickers(root) {
  $$('[data-img]', root).forEach(function (inp) {
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var img = new Image();
        img.onload = function () {
          var max = Number(inp.dataset.max), s = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          var data = c.toDataURL('image/png');
          if (data.length > 380000) data = c.toDataURL('image/jpeg', .85);
          $('[name=' + inp.dataset.img + ']', root).value = data;
          var pv = $('#img_' + inp.dataset.img, root); pv.src = data; pv.style.display = '';
        };
        img.src = r.result;
      };
      r.readAsDataURL(f);
    };
  });
  $$('[data-clr]', root).forEach(function (b) { b.onclick = function () { $('[name=' + b.dataset.clr + ']', root).value = ''; $('#img_' + b.dataset.clr, root).style.display = 'none'; }; });
}

function copyText(t, msg) {

}

function mpReadFile(file) {
  var csv = /\.csv$/i.test(file.name) || file.type === 'text/csv';
  return loadScript(XLSX_JS).then(function () {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onerror = function () { rej(new Error('Gagal membaca file')); };
      r.onload = function () {
        try {
          var wb = csv ? XLSX.read(r.result, { type: 'string', raw: false }) : XLSX.read(new Uint8Array(r.result), { type: 'array', cellDates: true });
          var sh = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(sh, { header: 1, defval: '', raw: false });
          // baris judul = baris pertama yang punya ≥ 3 sel terisi (beberapa marketplace memberi baris keterangan di atas)
          var h = 0; while (h < Math.min(10, rows.length) && rows[h].filter(function (x) { return String(x).trim(); }).length < 3) h++;
          res({ header: (rows[h] || []).map(function (x) { return String(x).trim(); }), rows: rows.slice(h + 1).filter(function (r) { return r.some(function (x) { return String(x).trim(); }); }) });
        } catch (e) { rej(new Error('Format file tidak dikenali: ' + e.message)); }
      };
      if (csv) r.readAsText(file); else r.readAsArrayBuffer(file);
    });
  }, function () { throw new Error('Pustaka pembaca Excel gagal dimuat (perlu internet).'); });
}
function mpGuess(header) {
  var map = {}, used = {};
  Object.keys(MP_COLS).forEach(function (k) {
    MP_COLS[k].some(function (re) {
      var i = header.findIndex(function (h, j) { return !used[j] && re.test(h); });
      if (i >= 0) { map[k] = i; used[i] = 1; return true; }
      return false;
    });
  });
  return map;
}
function mpNum(v) { if (typeof v === 'number') return v; var s = String(v || '').replace(/[^\d,.-]/g, ''); if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/[.,](?=\d{3}(\D|$))/g, ''); return Number(s) || 0; }

function mpBuild(data, map) {

        awb: String(col(r, 'awb') || ''), courier: col(r, 'courier'), total: mpNum(col(r, 'total')), items: [] };
      if (map.platformFee !== undefined && map.platformFee !== '') o.platformFee = Math.abs(mpNum(col(r, 'platformFee')));
      out.push(o);

function sfSaveOrder(o) { var l = sfOrders().filter(function (x) { return x.orderNo !== o.orderNo; }); l.unshift({ orderNo: o.orderNo, key: o.accessKey, total: o.payTotal || o.grandTotal, ts: o.createdAt || new Date().toISOString() }); ls.set('sfOrders', l.slice(0, 30)); }
function sfProd(id) { return (SF.home && SF.home.products || []).filter(function (p) { return p.id === id; })[0]; }
function sfPct(p) { return p.comparePrice > p.price ? Math.round((1 - p.price / p.comparePrice) * 100) : 0; }
function sfGo(r) { if (IS_GAS) { SF.route = r; sfRoute(); } else if (location.hash.slice(1) === r) sfRoute(); else location.hash = r; }

/** Deteksi mode etalase (async karena di Apps Script parameter URL dibaca lewat google.script.url). */
function storeModeCheck() {
  return new Promise(function (res) {
    if (IS_GAS) {
      try { google.script.url.getLocation(function (l) { var p = l.parameter || {}; if (p.toko) { SF.route = l.hash || ''; if (p.ref) sfCaptureRef(p.ref); res(true); } else res(false); }); }
      catch (e) { res(false); }
      return;
    }
    var q = new URLSearchParams(location.search);
    if (q.get('ref')) sfCaptureRef(q.get('ref'));
    res(!!q.get('toko'));
  });
}
function sfCaptureRef(code) {
  code = String(code).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
  if (!code) return;
  var days = 30;
  ls.set('sfRef', { code: code, until: Date.now() + days * 86400000 });
  setTimeout(function () { api('pub.aff', { code: code, visitorId: sfVid() }).then(function (r) { if (!r.valid) ls.del('sfRef'); }, function () { }); }, 1500);
}

document.addEventListener('click', function (e) { var a = e.target.closest && e.target.closest('.sf [data-r]'); if (a) { e.preventDefault(); sfGo(a.dataset.r); } });
function sfBadge() { var n = sfCart().reduce(function (a, c) { return a + c.qty; }, 0), b = $('#sfCount'); if (b) b.textContent = n ? n : ''; }

function sfRoute() {
  if (!SF.home || !SF.home.enabled) return;
  clearInterval(SF.poll);
  var r = SF.route || '', parts = r.split('/');
  window.scrollTo(0, 0);
  if (parts[0] === 'produk' && parts[1]) { sfRenderHome(); return sfProduct(parts[1]); }
  if (r === 'keranjang') return sfRenderCart();
  if (r === 'checkout') return sfRenderCheckout();
  if (parts[0] === 'pesanan' && parts[1]) return sfRenderOrder(parts[1], parts[2]);
  if (r === 'pesananku') return sfRenderMyOrders();
  if (r === 'lokasi') return sfRenderLocations();
  if (r === 'kebijakan') return sfRenderPolicy();
  sfRenderHome();
}

/* ---------- Beranda: banner, voucher, kategori, produk ---------- */
function sfRenderHome() {
  var h = SF.home, el = $('#sfV');
  var q = SF.q.toLowerCase();
  var list = h.products.filter(function (p) { return (!SF.cat || p.categoryId === SF.cat) && (!q || (p.name + ' ' + p.sku + ' ' + (p.description || '')).toLowerCase().indexOf(q) >= 0); });
  if (SF.sort === 'cheap') list.sort(function (a, b) { return a.price - b.price; });
  else if (SF.sort === 'rating') list.sort(function (a, b) { return b.rating - a.rating || b.reviews - a.reviews; });
  else if (SF.sort === 'disc') list.sort(function (a, b) { return sfPct(b) - sfPct(a); });
  var i = h.info || {};
  el.innerHTML = (q ? '' : '<section class="sf-hero"><div><h1>' + esc(i.name || 'Toko Online') + '</h1><p>' + esc(i.tagline || '') + '</p>' + (i.notice ? '<div class="sf-notice">' + ic('info', 'sm') + esc(i.notice) + '</div>' : '') +
    '<div class="row wrap" style="gap:6px;margin-top:10px">' + (i.freeShipMin ? '<span class="sf-pill">' + ic('truck', 'sm') + 'Gratis ongkir min. ' + rp(i.freeShipMin) + '</span>' : '') + (h.pay.cod ? '<span class="sf-pill">' + ic('wallet', 'sm') + 'Bisa COD</span>' : '') + (h.ship.pickup ? '<span class="sf-pill">' + ic('store', 'sm') + 'Ambil di toko</span>' : '') + '</div></div>' +
    (h.outlets.length ? '<button class="sf-heroloc" data-r="lokasi">' + ic('pin') + '<span><b>' + h.outlets.length + ' lokasi toko</b><small>' + esc(h.outlets.filter(function (o) { return o.main; })[0] ? h.outlets.filter(function (o) { return o.main; })[0].name : '') + '</small></span></button>' : '') + '</section>') +
    (h.vouchers.length && !q ? '<div class="sf-vouchers chips">' + h.vouchers.map(function (v) { return '<button class="sf-v" data-vc="' + esc(v.code) + '"><b>' + (v.type === 'PCT' ? v.value + '%' : (v.type === 'SHIP' ? 'Ongkir ' + rpShort(v.value) : rpShort(v.value))) + '</b><span>' + esc(v.name || v.code) + '</span><small>' + (v.minOrder ? 'Min. ' + rpShort(v.minOrder) : 'Tanpa minimum') + ' · <span class="mono">' + esc(v.code) + '</span></small></button>'; }).join('') + '</div>' : '') +
    '<div class="row between sf-bar" style="gap:8px;margin:12px 0 8px"><div class="chips sf-cats"><button class="chip' + (SF.cat ? '' : ' on') + '" data-cat="">Semua</button>' + h.categories.map(function (c) { return '<button class="chip' + (SF.cat === c.id ? ' on' : '') + '" data-cat="' + c.id + '">' + esc(c.name) + '</button>'; }).join('') + '</div>' +
    '<select class="input" id="sfSort" style="width:auto;min-height:36px;font-size:13px"><option value="">Urutkan</option><option value="cheap"' + (SF.sort === 'cheap' ? ' selected' : '') + '>Termurah</option><option value="disc"' + (SF.sort === 'disc' ? ' selected' : '') + '>Diskon terbesar</option><option value="rating"' + (SF.sort === 'rating' ? ' selected' : '') + '>Rating tertinggi</option></select></div>' +
    (list.length ? '<div class="sf-grid">' + list.map(sfCardHtml).join('') + '</div>' : '<div class="empty">' + ic('search') + '<div>Produk tidak ditemukan</div></div>');
  $$('[data-cat]', el).forEach(function (b) { b.onclick = function () { SF.cat = b.dataset.cat; sfRenderHome(); }; });
  $('#sfSort').onchange = function () { SF.sort = this.value; sfRenderHome(); };
  $$('[data-vc]', el).forEach(function (b) { b.onclick = function () { ls.set('sfVoucher', b.dataset.vc); copyTextQuiet(b.dataset.vc); toast('Voucher ' + b.dataset.vc + ' dipakai saat checkout', 'ok'); }; });
  sfBindCards(el);
}
function rpShort(n) { n = Number(n) || 0; return n >= 1000000 ? 'Rp' + String(Math.round(n / 100000) / 10).replace('.', ',') + 'jt' : (n >= 1000 ? 'Rp' + Math.round(n / 1000) + 'rb' : 'Rp' + n); }
function copyTextQuiet(t) { try { navigator.clipboard && navigator.clipboard.writeText(t); } catch (e) { } }
function sfCardHtml(p) {
  var pct = sfPct(p), out = p.stock <= 0, inCart = sfCart().filter(function (c) { return c.id === p.id; })[0];
  return '<article class="sf-card' + (out ? ' out' : '') + '" data-p="' + p.id + '"><div class="sf-img">' + (p.photoVer ? '<img alt="" data-th="' + p.id + '"' + (SF.thumbs[p.id] ? ' src="' + SF.thumbs[p.id] + '"' : '') + '>' : '<span>' + ic('image', 'lg') + '</span>') +
    (pct ? '<i class="sf-off">−' + pct + '%</i>' : '') + (out ? '<i class="sf-out">Habis</i>' : (p.stock <= 5 ? '<i class="sf-low">Sisa ' + p.stock + '</i>' : '')) + '</div>' +
    '<div class="sf-cb"><div class="sf-pn">' + esc(p.name) + '</div><div class="sf-pr"><b>' + rp(p.price) + '</b>' + (pct ? '<s>' + rp(p.comparePrice) + '</s>' : '') + '</div>' +
    '<div class="sf-meta">' + (p.reviews ? '<span class="stars sm">★</span> ' + String(p.rating).replace('.', ',') + ' (' + p.reviews + ')' : '<span class="faint">' + esc(p.unit || '') + '</span>') + '</div></div>' +
    '<button class="sf-add" data-add="' + p.id + '"' + (out ? ' disabled' : '') + ' aria-label="Tambah ke keranjang">' + (inCart ? '<b>' + inCart.qty + '</b>' : ic('plus')) + '</button></article>';
}
function sfBindCards(root) {
  $$('.sf-card', root).forEach(function (c) { c.onclick = function (e) { if (e.target.closest('[data-add]')) return; sfGo('produk/' + c.dataset.p); }; });
  $$('[data-add]', root).forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); sfAdd(b.dataset.add, 1); var p = sfProd(b.dataset.add); b.innerHTML = '<b>' + (sfCart().filter(function (c) { return c.id === p.id; })[0] || { qty: 0 }).qty + '</b>'; }; });
  sfLoadThumbs(root);
}
function sfLoadThumbs(root) {
  var need = $$('img[data-th]', root).filter(function (i) { return !i.getAttribute('src'); }).map(function (i) { return i.dataset.th; });
  if (!need.length) return;
  var apply = function () { $$('img[data-th]', root).forEach(function (i) { if (SF.thumbs[i.dataset.th] && !i.getAttribute('src')) i.src = SF.thumbs[i.dataset.th]; }); };
  kv.get('sfThumbs').then(function (c) {
    c = c || {};
    var miss = [];
    need.forEach(function (id) { var p = sfProd(id); if (c[id] && p && c[id].v === p.photoVer) SF.thumbs[id] = c[id].d; else miss.push(id); });
    apply();
    var batches = []; for (var i = 0; i < miss.length; i += 40) batches.push(miss.slice(i, i + 40));
    batches.reduce(function (pr, b) {
      return pr.then(function () { return api('pub.thumbs', { ids: b }).then(function (m) { Object.keys(m).forEach(function (id) { SF.thumbs[id] = m[id]; var p = sfProd(id); c[id] = { v: p ? p.photoVer : 0, d: m[id] }; }); apply(); }); });
    }, Promise.resolve()).then(function () { kv.set('sfThumbs', c); }, function () { });
  });
}
function sfAdd(id, qty, set) {
  var p = sfProd(id); if (!p) return;
  var c = sfCart(), x = c.filter(function (i) { return i.id === id; })[0];
  var nq = set ? qty : (x ? x.qty : 0) + qty;
  if (nq > p.stock) { toast('Stok ' + p.name + ' tinggal ' + p.stock, 'warn'); nq = p.stock; }
  if (nq <= 0) c = c.filter(function (i) { return i.id !== id; });
  else if (x) x.qty = nq; else c.push({ id: id, qty: nq });
  sfSetCart(c);
  if (!set && qty > 0) toast(ic('check', 'sm') + ' ' + esc(p.name) + ' masuk keranjang', 'ok', 1500);
}

/* ---------- Detail produk ---------- */
function sfProduct(id) {
  var p = sfProd(id);
  if (!p) { toast('Produk tidak ditemukan', 'warn'); return sfGo(''); }
  var pct = sfPct(p), qty = 1;
  var m = modal({
    title: esc(p.name), size: 'wide',
    body: '<div class="sf-pd"><div class="sf-pdimg" id="pdImg">' + (p.photoVer ? '<img alt="" src="' + (SF.thumbs[p.id] || '') + '">' + '<span class="gal-zoom">' + ic('zoom', 'sm') + '</span>' : '<span>' + ic('image', 'lg') + '</span>') + (pct ? '<i class="sf-off">−' + pct + '%</i>' : '') + '</div>' +
      '<div class="sf-pdb"><div class="sf-pr big"><b>' + rp(p.price) + '</b>' + (pct ? '<s>' + rp(p.comparePrice) + '</s>' : '') + '</div>' +
      '<div class="faint" style="font-size:12.5px">' + (p.reviews ? '<span class="stars">' + stars(p.rating) + '</span> ' + String(p.rating).replace('.', ',') + ' · ' + p.reviews + ' ulasan · ' : '') + (p.stock > 0 ? 'Stok ' + p.stock : '<b style="color:var(--bad)">Stok habis</b>') + ' · ' + esc(p.unit || '') + (p.weight ? ' · ' + p.weight + ' g' : '') + '</div>' +
      (p.description ? '<div class="sf-desc">' + esc(p.description).replace(/\n/g, '<br>') + '</div>' : '') +
      '<div class="row mt" style="gap:8px"><div class="qty"><button class="btn icon" id="pdM">' + ic('minus', 'sm') + '</button><b id="pdQ">1</b><button class="btn icon" id="pdP">' + ic('plus', 'sm') + '</button></div>' +
      '<button class="btn primary grow" id="pdAdd"' + (p.stock > 0 ? '' : ' disabled') + '>' + ic('bag', 'sm') + 'Tambah ke keranjang</button></div>' +
      '<div class="row wrap mt" style="gap:6px"><button class="btn sm" id="pdBuy"' + (p.stock > 0 ? '' : ' disabled') + '>Beli sekarang</button><button class="btn sm ghost" id="pdShare">' + ic('link', 'sm') + 'Bagikan</button>' + (SF.home.info.chat ? '<button class="btn sm ghost" id="pdAsk">' + ic('chat', 'sm') + 'Tanya penjual</button>' : '') + '</div>' +
      '<h3 class="mt">Ulasan</h3><div id="pdRev"><div class="faint">' + (p.reviews ? '<span class="spin"></span>' : 'Belum ada ulasan') + '</div></div></div></div>',
    onClose: function () { if ((SF.route || '').indexOf('produk/') === 0) { if (IS_GAS) SF.route = ''; else history.replaceState(null, '', location.pathname + location.search); SF.route = ''; } }
  });
  var setQ = function (d) { qty = Math.max(1, Math.min(p.stock || 1, qty + d)); m.$('#pdQ').textContent = qty; };
  m.$('#pdM').onclick = function () { setQ(-1); }; m.$('#pdP').onclick = function () { setQ(1); };
  m.$('#pdAdd').onclick = function () { sfAdd(p.id, qty); m.close(); sfRenderHome(); };
  m.$('#pdBuy').onclick = function () { sfAdd(p.id, qty); m.close(); sfGo('checkout'); };
  m.$('#pdShare').onclick = function () { var u = location.origin + location.pathname + location.search + '#produk/' + p.id; if (navigator.share) navigator.share({ title: p.name, text: p.name + ' ' + rp(p.price), url: u }).catch(function () { }); else { copyTextQuiet(u); toast('Link produk disalin', 'ok'); } };
  var ask = m.$('#pdAsk'); if (ask) ask.onclick = function () { m.close(); sfAskSeller('Halo, saya mau tanya produk ' + p.name + ' (' + p.sku + ')'); };
  var img = m.$('#pdImg');
  if (p.photoVer) {
    if (!SF.thumbs[p.id]) api('pub.thumbs', { ids: [p.id] }).then(function (r) { if (r[p.id]) { SF.thumbs[p.id] = r[p.id]; var i = img.querySelector('img'); if (i) i.src = r[p.id]; } });
    img.onclick = function () {
      zoomPhoto('sf:' + p.id, { product: { name: p.name }, bare: true, src: SF.thumbs[p.id], caption: rp(p.price),
        loader: function () { return kv.get('sfFull:' + p.id).then(function (c) { if (c && c.v === p.photoVer) return c.d; return api('pub.photo', { productId: p.id }).then(function (r) { kv.set('sfFull:' + p.id, { v: p.photoVer, d: r.data }); return r.data; }); }); } });
    };
  }
  if (p.reviews) api('pub.reviews', { productId: p.id }).then(function (list) {
    m.$('#pdRev').innerHTML = list.map(function (r) { return '<div class="sf-rev"><div><span class="stars sm">' + stars(r.rating) + '</span> <b>' + esc(r.name) + '</b> <span class="faint">' + fmtD(String(r.ts).slice(0, 10)) + '</span></div>' + (r.text ? '<div>' + esc(r.text) + '</div>' : '') + (r.reply ? '<div class="sf-reply">' + ic('store', 'sm') + ' ' + esc(r.reply) + '</div>' : '') + '</div>'; }).join('') || '<div class="faint">Belum ada ulasan</div>';
  });
}

/* ---------- Keranjang ---------- */
function sfRenderCart() {
  var el = $('#sfV'), c = sfCart();
  var items = c.map(function (x) { var p = sfProd(x.id); return p ? { p: p, qty: x.qty } : null; }).filter(Boolean);
  var sub = items.reduce(function (a, x) { return a + x.p.price * x.qty; }, 0), min = SF.home.info.minOrder;
  el.innerHTML = '<div class="sf-page"><div class="row between mb"><h2 style="margin:0">' + ic('bag') + ' Keranjang</h2><a href="#" data-r="">‹ Lanjut belanja</a></div>' +
    (items.length ? '<div class="sf-cart">' + items.map(function (x) {
      return '<div class="sf-ci"><div class="sf-cimg">' + (x.p.photoVer ? '<img alt="" data-th="' + x.p.id + '"' + (SF.thumbs[x.p.id] ? ' src="' + SF.thumbs[x.p.id] + '"' : '') + '>' : ic('image')) + '</div><div class="grow" style="min-width:0"><div class="ellipsis"><b>' + esc(x.p.name) + '</b></div><div class="faint">' + rp(x.p.price) + (x.p.stock < x.qty ? ' · <span style="color:var(--bad)">stok tinggal ' + x.p.stock + '</span>' : '') + '</div></div>' +
        '<div class="qty sm"><button class="btn icon sm" data-d="' + x.p.id + ',-1">' + ic('minus', 'sm') + '</button><b>' + x.qty + '</b><button class="btn icon sm" data-d="' + x.p.id + ',1">' + ic('plus', 'sm') + '</button></div><b class="num" style="min-width:86px;text-align:right">' + rp(x.p.price * x.qty) + '</b></div>';
    }).join('') + '</div><div class="sf-sum"><div class="row between"><span>Subtotal (' + items.reduce(function (a, x) { return a + x.qty; }, 0) + ' barang)</span><b>' + rp(sub) + '</b></div>' +
      (min && sub < min ? '<div class="alert warn mt" style="font-size:12.5px">Minimal belanja ' + rp(min) + ' — tambah ' + rp(min - sub) + ' lagi.</div>' : '') +
      (SF.home.info.freeShipMin && sub < SF.home.info.freeShipMin ? '<div class="faint mt" style="font-size:12.5px">' + ic('truck', 'sm') + ' Tambah ' + rp(SF.home.info.freeShipMin - sub) + ' untuk gratis ongkir</div>' : '') +

      if (!f) return;
      var t = toast('Mengunggah bukti…', 'ok', 20000);
      fileToAttachment(f, 'file').then(function (a) { return api('pub.payProof', { orderNo: o.orderNo, key: o.accessKey, name: a.name, data: a.data, thumb: a.thumb, source: a.source }, { timeout: 90000 }); })
        .then(function () { toast('Bukti terkirim, menunggu verifikasi penjual', 'ok', 4000); load(); }, function (e) { toast(e.message, 'bad', 5000); });
    };
    ['#sfProof', '#sfProofCam'].forEach(function (s) { var i = el.querySelector(s); if (i) i.onchange = function () { var f = this.files[0]; this.value = ''; up(f); }; });
    var pg = $('#sfPgCheck'); if (pg) pg.onclick = function () { load(); };
    var cc = $('#sfCancel'); if (cc) cc.onclick = function () { confirmBox('Batalkan pesanan?', 'Pesanan ' + esc(o.orderNo) + ' akan dibatalkan.', 'Batalkan', true).then(function (y) { if (y) api('pub.cancel', { orderNo: o.orderNo, key: o.accessKey }).then(function () { toast('Pesanan dibatalkan', 'ok'); load(); }, function (e) { toast(e.message, 'bad'); }); }); };
    $('#sfShareO').onclick = function () { copyText(location.origin + location.pathname + location.search + '#pesanan/' + o.orderNo + '/' + o.accessKey, 'Link pesanan disalin — simpan untuk melacak'); };
    var cmp = $('#sfCmp'); if (cmp) cmp.onclick = function () { sfComplain(o, load); };
    $$('[data-rv]', el).forEach(function (a) { a.onclick = function (e) { e.preventDefault(); sfReview(o, a.dataset.rv, load); }; });
    if ($('#sfOc')) sfBindChat($('#sfOc'), function (payload) { return api('pub.chat', Object.assign({ orderNo: o.orderNo, key: o.accessKey }, payload)); }, o.chat);
  };
  load();
  SF.poll = setInterval(function () { if (document.hidden) return; if ((SF.route || '').indexOf('pesanan/') !== 0 && !IS_GAS) return clearInterval(SF.poll); load(true); }, 20000);
}
function sfBindChat(root, send, initial) {
  var L = root.querySelector('.chat-l'), f = root.querySelector('.chat-f'), inp = f.querySelector('input.input'), fi = f.querySelector('input[type=file]');
  var paint = function (list) { L.innerHTML = chatMsgsHtml(list, 'CUST'); L.scrollTop = L.scrollHeight; };
  f.onsubmit = function (e) { e.preventDefault(); var t = inp.value.trim(); if (!t) return; inp.value = ''; send({ text: t }).then(paint, function (er) { toast(er.message, 'bad'); }); };
  fi.onchange = function () { var file = fi.files[0]; fi.value = ''; if (file) resizeImage(file, 900, 0.8).then(function (r) { return send({ image: canvasThumb(r.canvas) }); }).then(paint, function (er) { toast(er.message, 'bad'); }); };
  if (initial) paint(initial); else send({}).then(paint, function () { });
  var t = setInterval(function () { if (!document.body.contains(root)) return clearInterval(t); if (!document.hidden) send({}).then(paint, function () { }); }, 9000);
}
function sfComplain(o, done) {
  var m = modal({
    title: ic('ticket') + ' Komplain / retur ' + esc(o.orderNo), size: 'wide',
    body: '<form id="cmF" class="col"><div class="grid2"><label class="f">Jenis<select class="input" name="type"><option value="KOMPLAIN">Komplain saja</option><option value="RETUR">Retur barang (kirim balik)</option><option value="REFUND">Minta pengembalian dana</option></select></label>' +
      '<label class="f">Alasan<select class="input" name="reason">' + Object.keys(SHOP_REASON).map(function (k) { return '<option value="' + k + '">' + SHOP_REASON[k] + '</option>'; }).join('') + '</select></label></div>' +
      '<label class="f">Ceritakan masalahnya<textarea class="input" name="detail" rows="3" maxlength="1000" placeholder="mis. 1 botol pecah saat diterima"></textarea></label>' +
      '<div class="f"><span>Barang yang bermasalah</span>' + o.items.map(function (i) { return '<label class="row" style="gap:8px"><input type="checkbox" data-pi="' + i.productId + '"><span class="grow">' + esc(i.name) + '</span><input class="input" type="number" min="1" max="' + i.qty + '" value="' + i.qty + '" data-pq="' + i.productId + '" style="width:76px"></label>'; }).join('') + '</div>' +
      '<div class="f"><span>Foto bukti (maks 3) — sangat membantu</span><div class="row wrap"><label class="btn sm">' + ic('camera', 'sm') + 'Tambah foto<input type="file" accept="image/*" multiple hidden id="cmPh"></label><span id="cmN" class="faint"></span></div><div class="att-grid" id="cmG"></div></div>' +
      '<div class="faint" style="font-size:12px">' + esc(SF.home.info.policy || '') + '</div></form>',
    foot: '<button class="btn" data-close>Batal</button><button class="btn primary" id="cmOk">Kirim komplain</button>'
  });
  var photos = [];
  m.$('#cmPh').onchange = function () {
    [].slice.call(this.files).slice(0, 3 - photos.length).reduce(function (p, f) { return p.then(function () { return fileToAttachment(f, 'camera').then(function (a) { photos.push(a); }); }); }, Promise.resolve()).then(function () {
      m.$('#cmG').innerHTML = photos.map(function (a, i) { return attTileHtml(a, i, false); }).join(''); m.$('#cmN').textContent = photos.length + '/3';
    });
    this.value = '';
  };
  m.$('#cmOk').onclick = function () {
    var d = formData(m.$('#cmF'));
    var items = m.$$('[data-pi]').filter(function (c) { return c.checked; }).map(function (c) { return { productId: c.dataset.pi, qty: Number(m.$('[data-pq="' + c.dataset.pi + '"]').value) || 1 }; });
    if (d.type !== 'KOMPLAIN' && !items.length) return toast('Centang barang yang ingin diretur', 'warn');
    run(m.$('#cmOk'), api('pub.ticket', { orderNo: o.orderNo, key: o.accessKey, type: d.type, reason: d.reason, detail: d.detail, items: items, photos: photos.map(function (a) { return { data: a.data, thumb: a.thumb, source: a.source }; }) }, { timeout: 90000 })).then(function (r) {
      m.close(); toast('Komplain ' + r.ticketNo + ' terkirim. Penjual akan membalas lewat chat.', 'ok', 5000); done && done();
    });
  };
}
function sfReview(o, pid, done) {
  var it = o.items.filter(function (i) { return i.productId === pid; })[0], rating = 5;
  var m = modal({
    title: ic('star') + ' Ulas ' + esc(it ? it.name : ''),
    body: '<div class="sf-rate" id="rvS">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-n="' + n + '" class="on">★</button>'; }).join('') + '</div><label class="f mt">Ulasan<textarea class="input" id="rvT" rows="3" maxlength="500" placeholder="Bagaimana kualitas & pengirimannya?"></textarea></label>',
    foot: '<button class="btn" data-close>Batal</button><button class="btn primary" id="rvOk">Kirim ulasan</button>'
  });
  m.$$('[data-n]').forEach(function (b) { b.onclick = function () { rating = Number(b.dataset.n); m.$$('[data-n]').forEach(function (x) { x.classList.toggle('on', Number(x.dataset.n) <= rating); }); }; });
  m.$('#rvOk').onclick = function () { run(m.$('#rvOk'), api('pub.review', { orderNo: o.orderNo, key: o.accessKey, productId: pid, rating: rating, text: m.$('#rvT').value }), 'Terima kasih atas ulasannya!').then(function () { m.close(); done && done(); }); };
}

  $('#sfV').innerHTML = '<div class="sf-page"><h2>' + ic('receipt') + ' Pesanan saya</h2>' + (list.length ? '<div class="olist">' + list.map(function (o) { return '<button class="ocard" data-r="pesanan/' + o.orderNo + '/' + o.key + '"><div class="row between"><b class="mono">' + esc(o.orderNo) + '</b><b>' + rp(o.total) + '</b></div><div class="faint" style="font-size:12px">' + fmtDT(o.ts) + '</div></button>'; }).join('') + '</div>' : '<div class="faint">Belum ada pesanan di perangkat ini.</div>') +

}

    '<h3>Pembayaran</h3><p>Pesanan dengan transfer/QRIS diproses setelah pembayaran diverifikasi. Pesanan yang tidak dibayar dalam batas waktu otomatis dibatalkan.</p>' +

function sfRenderLocations() {
  var h = SF.home, el = $('#sfV'), list = h.outlets;
  el.innerHTML = '<div class="sf-page"><h2>' + ic('map') + ' Lokasi toko</h2><div class="map-host sf-map"><div class="map-canvas" id="sfMap"><div class="loading"><span class="spin"></span></div></div></div><div class="sf-locs">' +
    list.map(function (o, i) {
      return '<div class="card sf-loc" data-i="' + i + '">' + galleryHtml(o.photos, 'sl' + i) + '<div class="pad"><div class="row between"><b>' + esc(o.name) + '</b>' + openBadge(o) + '</div><div class="faint" style="font-size:12.5px">' + esc(o.address || '') + '</div>' + (o.hours ? '<div style="font-size:12.5px">' + ic('clock', 'sm') + ' ' + esc(o.hours) + '</div>' : '') +
        '<div class="row wrap mt" style="gap:6px">' + (outletHasLoc(o) ? '<a class="btn sm" target="_blank" rel="noopener" href="' + routeUrl(o) + '">' + ic('nav', 'sm') + 'Rute</a><button class="btn sm" data-fly="' + i + '">' + ic('map', 'sm') + 'Lihat di peta</button>' : '') + ((o.wa || o.phone) ? '<a class="btn sm" target="_blank" rel="noopener" href="' + waLink(o.wa || o.phone, 'Halo ' + o.name + ', ') + '">' + ic('chat', 'sm') + 'WhatsApp</a>' : '') + '</div></div></div>';
    }).join('') + '</div></div>';
  var src = {
    thumbs: function (ids) { return api('pub.outletThumbs', { ids: ids }); },
    full: function (id) { return kv.get('sfOph:' + id).then(function (c) { if (c) return c; return api('pub.outletPhoto', { id: id }).then(function (r) { kv.set('sfOph:' + id, r.data); return r.data; }); }); }
  };
  $$('.sf-loc', el).forEach(function (c) { var o = list[Number(c.dataset.i)]; bindGallery(c, o.photos, src, o.name); });
  var markers = [];
  mapLoad().then(function () {
    $('#sfMap').innerHTML = '';
    var map = mapCreate($('#sfMap')), pts = [];
    list.forEach(function (o, i) {
      if (!outletHasLoc(o)) return;
      var ll = [Number(o.lat), Number(o.lng)]; pts.push(ll);
      var mk = L.marker(ll, { icon: outletIcon(o, o.main), title: o.name }).addTo(map);
      mk.bindPopup(outletPopupHtml(o, { waText: 'Halo ' + o.name + ', ' }), { maxWidth: 300, minWidth: 250, className: 'opop-wrap', maxHeight: Math.max(260, $('#sfMap').clientHeight - 60), autoPanPaddingTopLeft: [10, 50], autoPanPaddingBottomRight: [10, 10] });
      mk.on('popupopen', function (e) { bindGallery(e.popup.getElement(), o.photos, src, o.name); });
      markers[i] = mk;
    });
    if (pts.length === 1) map.setView(pts[0], 16); else if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
    $$('[data-fly]', el).forEach(function (b) { b.onclick = function () { var i = Number(b.dataset.fly), o = list[i]; window.scrollTo(0, 0); map.setView([Number(o.lat), Number(o.lng)], 17, { animate: false }); setTimeout(function () { markers[i].openPopup(); }, 50); }; });
  }, function () { $('#sfMap').innerHTML = '<div class="empty">Peta butuh koneksi internet</div>'; });
}
function sfAskSeller(prefill) {
  if (!SF.home || !SF.home.info.chat) { if (SF.home && SF.home.info.wa) window.open(waLink(SF.home.info.wa, prefill || 'Halo, saya ingin bertanya'), '_blank'); return; }
  var who = ls.get('sfBuyer') || {};
  var m = modal({
    title: ic('chat') + ' Tanya penjual', size: 'wide',
    body: (who.name && who.phone ? '' : '<div class="grid2 mb" id="askWho"><label class="f">Nama<input class="input" id="askN" value="' + esc(who.name || '') + '"></label><label class="f">No. WhatsApp<input class="input" id="askP" inputmode="tel" value="' + esc(who.phone || '') + '"></label></div>') +
      '<div class="chat" id="askC"><div class="chat-l"></div><form class="chat-f"><label class="btn icon ghost">' + ic('image', 'sm') + '<input type="file" accept="image/*" hidden></label><input class="input grow" placeholder="Tulis pertanyaan…" maxlength="1000" value="' + esc(prefill || '') + '"><button class="btn primary icon">' + ic('send', 'sm') + '</button></form></div>' +
      (SF.home.info.wa ? '<div class="faint mt" style="font-size:12px">Butuh cepat? <a target="_blank" rel="noopener" href="' + waLink(SF.home.info.wa, prefill || 'Halo') + '">Chat lewat WhatsApp</a></div>' : '')
  });
  sfBindChat(m.$('#askC'), function (payload) {
    var n = m.$('#askN'), p = m.$('#askP');
    var name = n ? n.value.trim() : who.name, phone = p ? p.value.trim() : who.phone;
    if ((payload.text || payload.image) && (!name || !phone)) return Promise.reject(new Error('Isi nama & nomor WhatsApp dulu'));
    if (name && phone) ls.set('sfBuyer', Object.assign({}, ls.get('sfBuyer') || {}, { name: name, phone: phone }));
    return api('pub.chat', Object.assign({ visitorId: sfVid(), name: name, phone: phone }, payload));
  });
}

<script>
/* PWA: manifest & service worker hanya saat dibuka dari GitHub Pages (bukan dari iframe Apps Script).
   Versi GitHub sudah memuat <link rel="manifest"> statis di <head>; injeksi di bawah hanya cadangan. */
(function () {
  if (IS_GAS) return;
  if (!document.querySelector('link[rel="manifest"]')) {
    var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l);
  }
  if (!document.querySelector('link[rel="apple-touch-icon"]')) {
    var a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = 'icon-512.png'; document.head.appendChild(a);
  }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { scope: './' }).then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          w && w.addEventListener('statechange', function () {
            if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Versi baru tersedia — tutup & buka ulang aplikasi untuk memperbarui', 'ok', 6000);
          });
        });
      }).catch(function (e) { pwaState.swError = e && e.message || String(e); });
    });
  }
})();
storeModeCheck().then(function (isStore) { if (isStore) startStore(); else start(); });
</script>
