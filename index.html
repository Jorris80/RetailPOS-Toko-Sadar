function itemEditor(el, o) {
  o = o || {};
  var rows = (o.rows || []).slice();
  var pm = prodMap();
  var dl = 'dl' + Math.random().toString(36).slice(2, 7);
  var draw = function () {
    el.innerHTML = '<datalist id="' + dl + '">' + st.boot.products.filter(function (p) { return p.active; }).map(function (p) { return '<option value="' + esc(p.sku + ' — ' + p.name) + '">'; }).join('') + '</datalist>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Produk</th><th class="right" style="width:110px">Qty</th>' + (o.cost ? '<th class="right" style="width:140px">Harga beli/unit</th>' : '') + '<th style="width:44px"></th></tr></thead><tbody>' +
      rows.map(function (r, i) {
        var p = pm[r.productId];
        return '<tr><td>' + (p ? '<b>' + esc(p.name) + '</b><div class="faint" style="font-size:11.5px">' + esc(p.sku) + ' · stok ' + qtyFmt(p.stock) + '</div>' : '?') + '</td><td><input class="input right" type="number" step="any" min="0" data-q="' + i + '" value="' + r.qty + '"></td>' +
          (o.cost ? '<td><input class="input right" inputmode="numeric" data-c="' + i + '" value="' + r.cost + '"></td>' : '') + '<td><button class="btn icon sm ghost" data-x="' + i + '">' + ic('x', 'sm') + '</button></td></tr>';
      }).join('') + '<tr><td colspan="' + (o.cost ? 4 : 3) + '"><div class="row"><input class="input" list="' + dl + '" placeholder="Ketik/scan SKU atau nama produk lalu pilih" data-add><button class="btn icon" data-scan>' + ic('scan') + '</button></div></td></tr></tbody></table></div>' +
      (o.cost ? '<div class="right mt"><b>Total: ' + rp(rows.reduce(function (a, r) { return a + r.qty * r.cost; }, 0)) + '</b></div>' : '');
    $$('[data-q]', el).forEach(function (i) { i.oninput = function () { rows[i.dataset.q].qty = Number(i.value) || 0; if (o.cost) totalOnly(); }; });
    $$('[data-c]', el).forEach(function (i) { i.oninput = function () { rows[i.dataset.c].cost = num(i.value); totalOnly(); }; });
    $$('[data-x]', el).forEach(function (b) { b.onclick = function () { rows.splice(Number(b.dataset.x), 1); draw(); }; });
    var add = $('[data-add]', el);
    var pick = function (v) {
      var sku = String(v).split(' — ')[0].trim();
      var r = findByCode(sku) || findByCode(v);
      var p = r ? r.p : st.boot.products.filter(function (x) { return x.sku === sku; })[0];
      if (!p) return false;
      var ex = rows.filter(function (x) { return x.productId === p.id; })[0];
      if (ex) ex.qty += 1; else rows.push({ productId: p.id, qty: o.defaultQty || 1, cost: Number(p.cost) || 0 });
      draw(); var a2 = $('[data-add]', el); if (a2) a2.focus();
      return true;
    };
    add.onchange = function () { if (!pick(add.value)) toast('Produk tidak ditemukan', 'bad'); };
    add.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); if (!pick(add.value)) toast('Produk tidak ditemukan', 'bad'); } };
    $('[data-scan]', el).onclick = function () { openScanner(function (c) { return pick(c); }, true); };
  };
  var totalOnly = function () { var t = $('.right.mt b', el); if (t) t.textContent = 'Total: ' + rp(rows.reduce(function (a, r) { return a + r.qty * r.cost; }, 0)); };
  draw();
  return { get: function () { return rows.filter(function (r) { return r.qty > 0; }); }, set: function (r) { rows = r; draw(); } };
}

function bindImgPickers(root) {
  $$('[data-img]', root).forEach(function (inp) {
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var img = new Image();
        img.onload = function () {
          var max = Number(inp.dataset.max), s = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          var data = c.toDataURL('image/png');
          if (data.length > 380000) data = c.toDataURL('image/jpeg', .85);
          $('[name=' + inp.dataset.img + ']', root).value = data;
          var pv = $('#img_' + inp.dataset.img, root); pv.src = data; pv.style.display = '';
        };
        img.src = r.result;
      };
      r.readAsDataURL(f);
    };
  });
  $$('[data-clr]', root).forEach(function (b) { b.onclick = function () { $('[name=' + b.dataset.clr + ']', root).value = ''; $('#img_' + b.dataset.clr, root).style.display = 'none'; }; });

    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;

            if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Versi baru tersedia — tutup & buka ulang aplikasi untuk memperbarui', 'ok', 6000);
