<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Retail POS Enterprise — kasir multi-cabang berbasis Google Sheets dengan mode offline">
<title>Retail POS Enterprise</title>
<style>
:root{
  --brand:#059669;--brand-ink:#fff;--brand-soft:#05966918;
  --bg:#f3f5f8;--panel:#ffffff;--panel-2:#f8fafc;--line:#e3e8ef;--ink:#0f172a;--ink-2:#475569;--ink-3:#8492a6;
  --ok:#059669;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
  --radius:14px;--radius-sm:10px;--shadow:0 1px 2px #0f172a0d,0 6px 24px -12px #0f172a26;
  --nav-h:62px;--top-h:56px;--safe-b:env(safe-area-inset-bottom,0px);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b1220;--panel:#111a2b;--panel-2:#0f1727;--line:#1f2b40;--ink:#e6edf7;--ink-2:#a7b3c6;--ink-3:#6b7a91;
  --shadow:0 1px 2px #0006,0 8px 28px -14px #000c;color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220;--panel:#111a2b;--panel-2:#0f1727;--line:#1f2b40;--ink:#e6edf7;--ink-2:#a7b3c6;--ink-3:#6b7a91;
    --shadow:0 1px 2px #0006,0 8px 28px -14px #000c;color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.right{text-align:right}.center{text-align:center}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.gap-lg{gap:16px}
.mt{margin-top:12px}.mt-lg{margin-top:20px}.mb{margin-bottom:12px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:20px}h2{font-size:17px}h3{font-size:15px}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}.ico.lg{width:26px;height:26px}

/* ---------- Tombol & input ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;white-space:nowrap;transition:transform .06s,background .15s,border-color .15s;touch-action:manipulation}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.lg{min-height:52px;font-size:16px;padding:0 20px}
.btn.block{width:100%}
.btn.icon{width:40px;padding:0}
.btn.icon.sm{width:32px}
.input,select.input,textarea.input{width:100%;min-height:42px;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{min-height:80px;resize:vertical}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input.big{font-size:22px;font-weight:700;min-height:54px;text-align:right}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
label.chk{display:flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
label.chk input{width:18px;height:18px;accent-color:var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.grid2.keep{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- Kartu, badge, tabel ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-color:transparent}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:transparent}
.badge.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-color:transparent}
.badge.info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info);border-color:transparent}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm);-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--panel-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.kpi .l{font-size:12px;color:var(--ink-2);font-weight:600}
.kpi .v{font-size:20px;font-weight:800;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:99px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.empty{padding:36px 16px;text-align:center;color:var(--ink-3)}
.empty .ico{width:40px;height:40px;margin-bottom:8px;opacity:.6}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:99px}
.list-item{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.alert{padding:10px 12px;border-radius:var(--radius-sm);font-size:13px;border:1px solid var(--line);background:var(--panel-2)}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.alert.bad{border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.alert.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 8%,transparent)}

/* ---------- Kerangka aplikasi ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:14.5px;line-height:1.2}
.brand small{color:var(--ink-3);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:600;cursor:pointer}
.nav a:hover{background:var(--panel-2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.nav .cnt{margin-left:auto}
.side-foot{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:var(--top-h);display:flex;align-items:center;gap:10px;padding:0 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .title{font-weight:800;font-size:16px}
.content{padding:18px;max-width:1400px;width:100%;margin:0 auto;flex:1}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.status-dot.off{background:var(--bad)}.status-dot.sync{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.bnav{display:none}
@media (max-width:899px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:0 12px;padding-top:env(safe-area-inset-top,0)}
  .content{padding:12px 12px calc(var(--nav-h) + var(--safe-b) + 16px)}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--panel);border-top:1px solid var(--line)}
  .bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);text-decoration:none;cursor:pointer;position:relative}
  .bnav a.on{color:var(--brand)}
  .bnav .dotc{position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
}

/* ---------- Kasir (POS) ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.pos-left{min-width:0;display:flex;flex-direction:column;gap:12px}
.searchbar{display:flex;gap:8px}
.searchbar .input{font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-sm);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px;transition:border-color .12s,transform .06s;touch-action:manipulation}
.pcard:hover{border-color:var(--brand)}
.pcard:active{transform:scale(.97)}
.pcard .nm{font-weight:650;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pr{margin-top:auto;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.pcard .st{font-size:11.5px;color:var(--ink-3)}
.pcard .st.low{color:var(--warn);font-weight:700}.pcard .st.out{color:var(--bad);font-weight:700}
.pcard .pr{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pcard .promo{flex:none}
.pcard .q{position:absolute;top:-6px;right:-6px;background:var(--brand);color:var(--brand-ink);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:800;padding:0 6px;box-shadow:var(--shadow)}
.cart{position:sticky;top:calc(var(--top-h) + 16px);display:flex;flex-direction:column;max-height:calc(100vh - var(--top-h) - 32px);max-height:calc(100dvh - var(--top-h) - 32px);padding:0;overflow:hidden}
.cart-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.cart-body{flex:1;overflow-y:auto;min-height:120px}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.cline:hover{background:var(--panel-2)}
.cline .nm{font-weight:650;font-size:13.5px}
.cline .meta{font-size:12px;color:var(--ink-2)}
.cline .meta .tag{color:var(--ok);font-weight:600}
.cline .meta .nego{color:var(--warn);font-weight:700}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.qty button{width:34px;height:32px;border:0;background:transparent;cursor:pointer;font-size:18px;font-weight:700;color:var(--ink-2)}
.qty button:active{background:var(--panel-2)}
.qty span{min-width:34px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.cart-foot{border-top:1px solid var(--line);padding:12px 14px;background:var(--panel-2);display:flex;flex-direction:column;gap:6px}
.sumrow{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.sumrow b{color:var(--ink);font-variant-numeric:tabular-nums}
.sumrow.total{font-size:18px;color:var(--ink);font-weight:800;margin-top:2px}
.cartbar{display:none}
@media (max-width:1100px){.pos{grid-template-columns:minmax(0,1fr) 340px}}
@media (max-width:899px){
  .pos{grid-template-columns:1fr}
  .pos > .cart{display:none}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
  .pcard{min-height:96px;padding:10px}
  .cartbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);z-index:35;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:10px 14px;align-items:center;gap:10px;box-shadow:0 10px 30px -10px #0008;cursor:pointer;border:0;font-weight:700}
  .cartbar .t{margin-left:auto;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  .pos-left{padding-bottom:70px}
}

/* ---------- Modal / sheet ---------- */
.ov{position:fixed;inset:0;z-index:100;background:#0f172a8c;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.md{background:var(--panel);border-radius:18px;box-shadow:0 30px 80px -20px #000a;width:100%;max-width:520px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;animation:pop .18s}
.md.wide{max-width:860px}.md.xl{max-width:1100px}
.md-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.md-h h2{flex:1}
.md-b{padding:16px;overflow-y:auto;flex:1}
.md-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
@media (max-width:640px){
  .ov{padding:0;align-items:flex-end}
  .md,.md.wide,.md.xl{max-width:none;border-radius:18px 18px 0 0;max-height:94dvh;padding-bottom:var(--safe-b)}
  .md.full{max-height:100dvh;height:100dvh;border-radius:0}
  @keyframes pop{from{transform:translateY(40px)}}
}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 24px);transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast > div{background:#0f172a;color:#fff;padding:10px 14px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px -8px #0009;animation:pop .2s;pointer-events:auto;font-size:13.5px;width:100%}
.toast > div.bad{background:#b91c1c}.toast > div.ok{background:#047857}.toast > div.warn{background:#b45309}
@media (max-width:899px){.toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 10px)}}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--ink-3)}

/* ---------- Bayar ---------- */
.paytotal{text-align:center;padding:6px 0 14px}
.paytotal .l{color:var(--ink-2);font-weight:600;font-size:13px}
.paytotal .v{font-size:34px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.methods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.methods button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 4px;font-weight:700;font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.methods button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
@media (max-width:420px){.methods{grid-template-columns:repeat(3,1fr)}}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.quick button{min-height:42px}
.change{font-size:22px;font-weight:850;font-variant-numeric:tabular-nums}

/* ---------- Login ---------- */
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 10% -10%,var(--brand-soft),transparent),var(--bg)}
.auth .card{width:100%;max-width:420px;padding:24px}
.auth .logo{width:52px;height:52px;border-radius:15px;font-size:20px}

/* ---------- Grafik batang ---------- */
.chart{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:160px;padding-top:10px}
.chart .b.zero{background:var(--line)}
.chart .b{flex:1;min-width:4px;max-width:56px;background:var(--brand);border-radius:4px 4px 0 0;position:relative;opacity:.85}
.chart .b:hover{opacity:1}
.chart .b[data-t]:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:11px;padding:3px 6px;border-radius:6px;white-space:nowrap;margin-bottom:4px;z-index:2}
.chart-x{display:flex;gap:3px;font-size:10px;color:var(--ink-3);margin-top:4px}
.chart-x{justify-content:center}.chart-x span{flex:1;text-align:center;overflow:hidden;max-width:56px}
#cartSheetBody .cart-h b{font-size:0}#cartSheetBody .cart-h b span{font-size:13px}

/* ---------- Cetak ---------- */
#print-area{display:none}
@media print{
  body *{visibility:hidden!important}
  #print-area,#print-area *{visibility:visible!important}
  #print-area{display:block!important;position:absolute;left:0;top:0;width:100%}
  .ov,.toast{display:none!important}
}
.rcpt{font:12px/1.35 var(--mono);color:#000;background:#fff;width:100%;max-width:300px;margin:0 auto;padding:8px}
.rcpt.w58{max-width:220px;font-size:11px}
.rcpt .c{text-align:center}.rcpt hr{border:0;border-top:1px dashed #000;margin:6px 0}
.rcpt table{width:100%;border-collapse:collapse}.rcpt td{padding:1px 0;vertical-align:top}.rcpt td.r{text-align:right;white-space:nowrap}
.rcpt .big{font-size:14px;font-weight:700}
.rcpt-prev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:46vh;overflow:auto}
.labels{display:grid;gap:0;background:#fff;color:#000}
.labels .lb{border:1px dashed #bbb;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;font-family:Arial,sans-serif}
.labels .lb .n{font-size:10px;font-weight:700;line-height:1.15;max-height:2.3em;overflow:hidden}

.pimg .zbtn:hover{background:#0f172a}
.pcard .q{z-index:2}
.pimg.sm{width:44px;height:44px;aspect-ratio:auto;margin:0;border-radius:8px;font-size:13px;flex:none}

.zm-ctl .btn{background:#ffffff1a;border-color:#ffffff33;color:#fff}
.photo-edit{display:flex;gap:12px;align-items:center;padding:10px;border:1px dashed var(--line);border-radius:12px}
.pe-prev{width:110px;height:110px;flex:none;border-radius:10px;overflow:hidden;background:var(--panel-2);display:grid;place-items:center;text-align:center;font-size:11px;color:var(--ink-3);cursor:zoom-in}

.kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel-2)}
.denoms{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px}

.legal{font-size:13px;line-height:1.6}

.legal ol,.legal ul{padding-left:20px;margin:6px 0}

<script>
/* ---- Mesin hitung (identik dengan Calc.gs di server) ---- */
function RPOS_calcCart(cart, ctx) {
  var S = ctx.settings || {};
  var R = function (n) { return Math.round(Number(n) || 0); };
  var items = [];
  var gross = 0, discAuto = 0, discManual = 0, totalQty = 0;
  var promoLabels = [];
  var needsApproval = [];
  var maxPct = Number(S.maxCashierDiscPct);
  if (!isFinite(maxPct)) maxPct = 5;

  var activePromos = (ctx.promos || []).filter(function (p) {
    var on = p.active === true || p.active === 'TRUE' || p.active === 'true';
    if (!on) return false;
    if (p.outletId && ctx.outletId && String(p.outletId) !== String(ctx.outletId)) return false;
    if (p.startDate && ctx.today && String(p.startDate).substring(0, 10) > ctx.today) return false;
    if (p.endDate && ctx.today && String(p.endDate).substring(0, 10) < ctx.today) return false;
    return true;
  });

  (cart.items || []).forEach(function (it, idx) {
    var prod = (ctx.products || {})[it.productId];
    if (!prod) return;
    var qty = Number(it.qty);
    if (!isFinite(qty) || qty <= 0) return;
    qty = Math.round(qty * 1000) / 1000;
    var listPrice = R(prod.price);
    var hasCustom = it.isCustom === true && it.unitPrice !== undefined && it.unitPrice !== null && it.unitPrice !== '' && isFinite(Number(it.unitPrice)) && Number(it.unitPrice) >= 0;
    var unitPrice = hasCustom ? R(it.unitPrice) : (it.unitPrice !== undefined && it.unitPrice !== null && it.unitPrice !== '' && !it.isCustom ? R(it.unitPrice) : listPrice);
    var isCustom = hasCustom && unitPrice !== listPrice;
    var lineGross = R(unitPrice * qty);

    // Promo otomatis HANYA untuk harga normal (perbaikan: versi asli tetap memberi promo pada harga nego)
    var bestDisc = 0, bestLabel = '';
    if (!isCustom) {
      activePromos.forEach(function (p) {
        var t = String(p.type);
        if (t.indexOf('TRX_') === 0) return;
        var match = (p.productId && String(p.productId) === String(prod.id)) ||
          (!p.productId && p.categoryId && String(p.categoryId) === String(prod.categoryId));
        if (!match) return;
        var minQty = Number(p.minQty) || 1;
        if (qty < minQty) return;
        var v = Number(p.value) || 0, d = 0;
        if (t === 'ITEM_AMOUNT') d = v * Math.floor(qty);
        else if (t === 'ITEM_PERCENT') d = lineGross * Math.min(100, v) / 100;
        else if (t === 'BUNDLE') d = Math.floor(qty / minQty) * v;
        d = Math.min(R(d), lineGross);
        if (d > bestDisc) { bestDisc = d; bestLabel = p.name; }
      });
    }
    if (bestLabel && promoLabels.indexOf(bestLabel) < 0) promoLabels.push(bestLabel);

    var manual = Math.max(0, R(it.discManual));
    manual = Math.min(manual, lineGross - bestDisc);           // perbaikan: diskon tidak boleh melebihi harga
    var subtotal = lineGross - bestDisc - manual;

    var floor = Number(prod.minPrice) > 0 ? Number(prod.minPrice) : Number(prod.cost) || 0;
    if (isCustom && unitPrice < floor) needsApproval.push({ idx: idx, reason: 'HARGA_DI_BAWAH_MINIMUM', detail: prod.name + ' Rp' + unitPrice + ' < batas Rp' + floor });
    if (manual > 0 && lineGross > 0 && (manual / lineGross) * 100 > maxPct) needsApproval.push({ idx: idx, reason: 'DISKON_MELEBIHI_BATAS', detail: prod.name + ' diskon ' + Math.round(manual / lineGross * 100) + '% > ' + maxPct + '%' });

    gross += lineGross; discAuto += bestDisc; discManual += manual; totalQty += qty;
    items.push({
      productId: prod.id, sku: prod.sku || '', barcode: prod.barcode || '', name: prod.name, unit: prod.unit || 'PCS',
      qty: qty, unitPrice: unitPrice, originalPrice: listPrice, isCustom: isCustom,
      customReason: isCustom ? (it.customReason || 'Tawar-menawar') : '',
      discAuto: bestDisc, discManual: manual, subtotal: subtotal,
      taxable: !(prod.taxable === false || prod.taxable === 'FALSE' || prod.taxable === 'false'),
      unitCost: R(prod.cost), promo: bestLabel
    });
  });

  var linesNet = gross - discAuto - discManual;

  // Promo level transaksi (pilih satu yang terbaik)
  var discTrx = 0, trxLabel = '';
  activePromos.forEach(function (p) {
    var t = String(p.type);
    if (t !== 'TRX_AMOUNT' && t !== 'TRX_PERCENT') return;
    if (linesNet < (Number(p.minSpend) || 0)) return;
    var v = Number(p.value) || 0;
    var d = t === 'TRX_AMOUNT' ? v : linesNet * Math.min(100, v) / 100;
    d = Math.min(R(d), linesNet);
    if (d > discTrx) { discTrx = d; trxLabel = p.name; }
  });
  if (trxLabel) promoLabels.push(trxLabel);

  // Penukaran poin member
  var pointValue = Number(S.pointValue) || 0;
  var pointsUsed = Math.max(0, Math.floor(Number(cart.pointsUsed) || 0));
  var discPoints = pointValue > 0 ? Math.min(R(pointsUsed * pointValue), linesNet - discTrx) : 0;
  if (pointValue > 0 && discPoints < pointsUsed * pointValue) pointsUsed = Math.floor(discPoints / pointValue);
  if (pointValue <= 0) pointsUsed = 0;

  var net = Math.max(0, linesNet - discTrx - discPoints);

  // PPN: hanya bila diaktifkan & outlet PKP; dihitung dari porsi barang kena pajak
  var taxOn = (S.taxEnabled === true || S.taxEnabled === 'TRUE' || S.taxEnabled === 'true') &&
    !(ctx.outlet && (ctx.outlet.isPkp === false || ctx.outlet.isPkp === 'FALSE' || ctx.outlet.isPkp === 'false'));
  if (cart.taxOff === true) taxOn = false;
  var rate = Number(S.taxRate);
  if (!isFinite(rate)) rate = 11;
  var taxableLines = 0;
  items.forEach(function (i) { if (i.taxable) taxableLines += i.subtotal; });
  var taxableNet = linesNet > 0 ? R(net * taxableLines / linesNet) : 0;
  var tax = 0, taxBase = net, grand = net;
  if (taxOn && rate > 0 && taxableNet > 0) {
    if (S.taxMode === 'EXCLUSIVE') {
      tax = R(taxableNet * rate / 100);
      taxBase = net;
      grand = net + tax;
    } else {
      var dpp = R(taxableNet * 100 / (100 + rate));
      tax = taxableNet - dpp;
      taxBase = net - tax;
      grand = net;
    }
  }

  // Pembulatan ke bawah (mis. Rp100) — selisih dicatat
  var roundTo = Number(S.roundTo) || 0;
  var rounding = 0;
  if (roundTo > 0 && cart.noRounding !== true) {
    var rounded = Math.floor(grand / roundTo) * roundTo;
    rounding = rounded - grand;
    grand = rounded;
  }

  return {
    items: items, grossSubtotal: gross, discAuto: discAuto, discManual: discManual, discTrx: discTrx,
    discPoints: discPoints, pointsUsed: pointsUsed, discountTotal: discAuto + discManual + discTrx + discPoints,
    net: net, taxEnabled: taxOn, taxRate: taxOn ? rate : 0, taxMode: S.taxMode === 'EXCLUSIVE' ? 'EXCLUSIVE' : 'INCLUSIVE',
    taxBase: taxBase, taxTotal: tax, rounding: rounding, grandTotal: grand, totalQty: totalQty,
    promos: promoLabels, needsApproval: needsApproval
  };
}

/* ---------- Penyimpanan lokal (IndexedDB, cadangan memori) ---------- */
var kv = (function () {
  var mem = {}, dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise(function (res) {
      try {
        var r = indexedDB.open('rpos', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
    return dbp;
  }
  return {
    get: function (k) {
      return open().then(function (db) {
        if (!db) return mem[k];
        return new Promise(function (res) {
          try { var q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = function () { res(q.result); }; q.onerror = function () { res(mem[k]); }; }
          catch (e) { res(mem[k]); }
        });
      });
    },
    set: function (k, v) {
      mem[k] = v;
      return open().then(function (db) {
        if (!db) return;
        return new Promise(function (res) {
          try { var t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; } catch (e) { res(); }
        });
      });
    },
    del: function (k) { delete mem[k]; return open().then(function (db) { if (db) try { db.transaction('kv', 'readwrite').objectStore('kv').delete(k); } catch (e) { } }); }
  };
})();
var ls = {
  get: function (k, d) { try { var v = localStorage.getItem('rpos.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('rpos.' + k, JSON.stringify(v)); } catch (e) { } },
  del: function (k) { try { localStorage.removeItem('rpos.' + k); } catch (e) { } }
};

/* ---------- API (google.script.run atau fetch ke URL Apps Script) ---------- */
function api(action, payload, opt) {
  opt = opt || {};
  var req = { action: action, token: st.token, payload: payload || {} };
  var p;
  if (IS_GAS) {
    p = new Promise(function (res, rej) {
      google.script.run.withSuccessHandler(function (s) { try { res(JSON.parse(s)); } catch (e) { rej(e); } })
        .withFailureHandler(function (e) { rej(new Error(e && e.message || 'Gagal menghubungi server')); }).api(JSON.stringify(req));
    });
  } else {
    if (!st.device.apiUrl) return Promise.reject(new Error('URL server (Apps Script) belum diatur.'));
    var ctrl = window.AbortController ? new AbortController() : null;
    var to = setTimeout(function () { ctrl && ctrl.abort(); }, opt.timeout || 30000);
    p = fetch(st.device.apiUrl, { method: 'POST', body: JSON.stringify(req), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { clearTimeout(to); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .catch(function (e) { clearTimeout(to); throw new Error(e.name === 'AbortError' ? 'Waktu habis menghubungi server' : (e.message === 'Failed to fetch' ? 'Tidak dapat terhubung ke server' : e.message)); });
  }
  return p.then(function (r) {
    setOnline(true);
    if (!r.ok) {
      var err = new Error(r.error || 'Terjadi kesalahan');
      err.code = r.code;
      if (r.code === 'AUTH' && !opt.noLogout) { toast('Sesi berakhir, silakan login kembali', 'warn'); setTimeout(logout, 800); }
      throw err;
    }
    return r.data;
  }, function (e) {
    if (!e.code) setOnline(false);
    e.network = !e.code;
    throw e;
  });
}

function setOnline(v) {
  if (st.online === v) return;

/* ---------- Antrean offline ---------- */
function enqueue(op, data) {
  var item = { opId: uuid(), op: op, data: data, at: new Date().toISOString(), tries: 0 };
  st.queue.push(item);
  return kv.set('queue', st.queue).then(function () { renderStatus(); flushQueue(); return item; });
}
var flushTimer = null;
function flushQueue() {
  if (st.syncing || !st.queue.length || !st.token) return Promise.resolve();
  st.syncing = true; renderStatus();
  var batch = st.queue.slice(0, 20);
  return api('sync', { ops: batch }, { timeout: 60000 }).then(function (res) {
    var done = {}, failed = 0;
    res.results.forEach(function (r) {
      var q = st.queue.filter(function (x) { return x.opId === r.opId; })[0];
      if (!q) return;
      if (r.ok) {
        done[r.opId] = 1;
        if (q.op === 'sale') markLocalSale(q.data.id, { synced: true, flags: r.data.flags || [], receiptNoServer: r.data.receiptNo });
        if (q.op === 'sale' && r.data.flags && r.data.flags.length) toast('Struk ' + r.data.receiptNo + ' ditandai: ' + r.data.flags.join(', '), 'warn', 6000);
      } else { q.tries = (q.tries || 0) + 1; q.error = r.error; failed++; }
    });
    st.queue = st.queue.filter(function (x) { return !done[x.opId]; });
    st.lastSync = new Date().toISOString(); ls.set('lastSync', st.lastSync);
    return kv.set('queue', st.queue).then(function () {
      st.syncing = false; renderStatus();
      if (failed) toast(failed + ' operasi gagal disinkronkan — lihat Pengaturan › Perangkat', 'bad', 5000);
      var remaining = st.queue.filter(function (q) { return !q.error || q.tries < 3; }).length;
      if (remaining && Object.keys(done).length) return flushQueue();
    });
  }, function (e) {
    st.syncing = false; renderStatus();
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flushQueue, e.network ? 20000 : 60000);
  });
}
setInterval(function () { if (st.queue.length && navigator.onLine) flushQueue(); }, 45000);

function markLocalSale(id, patch) {
  st.localSales.forEach(function (s) { if (s.id === id) Object.assign(s, patch); });
  kv.set('localSales', st.localSales);
}

/* ---------- Toast & modal ---------- */
function toast(msg, type, ms) {
  var el = document.createElement('div');
  el.className = type || '';
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(function () { el.remove(); }, ms || 2800);
}
var modalStack = [];
function modal(o) {
  var id = 'm' + Date.now() + Math.random().toString(36).slice(2, 6);
  var w = document.createElement('div');
  w.className = 'ov'; w.id = id;
  w.innerHTML = '<div class="md ' + (o.size || '') + '" role="dialog" aria-modal="true"><div class="md-h"><h2>' + (o.title || '') + '</h2>' +
    (o.noClose ? '' : '<button class="btn icon ghost" data-close aria-label="Tutup">' + ic('x') + '</button>') + '</div>' +
    '<div class="md-b">' + (o.body || '') + '</div>' + (o.foot ? '<div class="md-f">' + o.foot + '</div>' : '') + '</div>';
  $('#modals').appendChild(w);
  var close = function (v) { if (!w.parentNode) return; w.remove(); modalStack = modalStack.filter(function (m) { return m.id !== id; }); if (o.onClose) o.onClose(v); };
  w.addEventListener('click', function (e) { if (e.target === w && !o.noClose && !o.sticky) close(); if (e.target.closest('[data-close]')) close(); });
  var m = { id: id, el: w, close: close, $: function (s) { return w.querySelector(s); }, $$: function (s) { return $$(s, w); } };
  modalStack.push(m);
  if (o.onOpen) o.onOpen(m);
  var f = w.querySelector('[autofocus]');
  if (f) setTimeout(function () { f.focus(); if (f.select) f.select(); }, 60);
  return m;
}
function closeTopModal() { var m = modalStack[modalStack.length - 1]; if (m) m.close(); }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modalStack.length) closeTopModal(); });
function confirmBox(title, msg, okLabel, danger) {
  return new Promise(function (res) {
    var m = modal({
      title: title, body: '<p style="margin:0">' + msg + '</p>',
      foot: '<button class="btn" data-close>Batal</button><button class="btn ' + (danger ? 'danger solid' : 'primary') + '" id="cbok">' + (okLabel || 'Ya') + '</button>',
      onClose: function (v) { res(v === true); }
    });

}
function busy(btn, on) {
  if (!btn) return;
  if (on) { btn.dataset.html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  else { btn.disabled = false; if (btn.dataset.html) btn.innerHTML = btn.dataset.html; }
}

  busy(btn, true);
  return promise.then(function (r) { busy(btn, false); if (okMsg) toast(okMsg, 'ok'); return r; }, function (e) { busy(btn, false); toast(e.message, 'bad', 5000); throw e; });
}
function formData(root) {
  var o = {};

  $$('input[name],select[name],textarea[name]', root).forEach(function (el) {
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'number' || el.dataset.num !== undefined) o[el.name] = num(el.value);
    else o[el.name] = el.value.trim();

}

/* ---------- Bootstrap & cache offline ---------- */
function applyBoot(b) {
    st.boot = b; st.user = b.user; st.outletId = b.outletId;
    ls.set('user', b.user); ls.set('outletId', b.outletId);
    // stok lokal dikurangi transaksi yang masih di antrean (belum tercatat di server)
    applyPendingStock();
    // shift lokal yang masih punya antrean selalu dipertahankan (sumber kebenaran perangkat)
    var pendingShift = st.shift && st.queue.some(function (q) { return q.data && (q.data.shiftId === st.shift.id || q.data.id === st.shift.id); });
    if (b.openShift && (!st.shift || (st.shift.id === b.openShift.id && !pendingShift))) {
      st.shift = Object.assign({}, b.openShift);
      kv.set('shift', st.shift);
    } else if (!b.openShift && st.shift && st.shift.outletId === b.outletId && !pendingShift) {
      st.shift = null; kv.set('shift', null);
    }
    applyTheme();
    ls.set('brand', { storeName: b.settings.storeName, logo: b.settings.logo && b.settings.logo.length < 60000 ? b.settings.logo : '', brandColor: b.settings.brandColor });
    if (typeof syncThumbs === 'function') setTimeout(syncThumbs, 400);
    return kv.set('boot', b);
}

  return api('bootstrap', { outletId: st.outletId }).then(applyBoot, function (e) {
    if (e.network) {
      return kv.get('boot').then(function (b) {
        if (!b) throw new Error('Perangkat offline dan belum pernah memuat data. Sambungkan internet untuk login pertama kali.');
        st.boot = b; applyTheme();
        if (force !== 'silent') toast('Mode offline — memakai data tersimpan', 'warn');
      });
    }
    throw e;
  });
}
function applyPendingStock() {
  var pm = prodMap();
  st.queue.forEach(function (q) {
    if (q.op === 'sale' && q.data.outletId === st.outletId) (q.data.items || []).forEach(function (i) { if (pm[i.productId]) pm[i.productId].stock = (Number(pm[i.productId].stock) || 0) - Number(i.qty); });
  });
}

function start() {
  applyTheme();
  Promise.all([kv.get('queue'), kv.get('held'), kv.get('shift'), kv.get('localSales'), kv.get('thumbs')]).then(function (r) {
    st.queue = r[0] || []; st.held = r[1] || []; st.shift = r[2] || null; st.localSales = r[3] || []; thumbs = r[4] || {};
    if (!IS_GAS && !st.device.apiUrl) return renderAuth('url');
    if (st.token) {
      // tampilkan data tersimpan seketika (stale-while-revalidate), perbarui di latar belakang
      return kv.get('boot').then(function (cached) {
        if (cached && st.user && cached.user && cached.user.id === st.user.id) {
          st.boot = cached; if (!st.outletId) st.outletId = cached.outletId;
          applyPendingStock(); renderShell();
          loadBoot('silent').then(function () {
            // segarkan bagian yang aman tanpa mengganggu kasir yang sedang mengetik
            renderStatus(); applyTheme();
            if (st.view === 'pos' && $('#pgrid')) { renderProducts(); renderCart(); }
            else if (st.view === 'pos' && !modalStack.length) go('pos');
            flushQueue();
          }, function (e) { if (e.code === 'AUTH') { st.token = ''; ls.del('token'); renderAuth('login', ls.get('brand')); } });
          return;
        }
        return loadBoot().then(function () { renderShell(); flushQueue(); }, onBootFail);
      });
    }
    return checkSetup();
  });
}
function onBootFail(e) {
        if (e.code === 'AUTH') { st.token = ''; ls.del('token'); return checkSetup(); }
        $('#app').innerHTML = '<div class="auth"><div class="card"><div class="alert bad">' + esc(e.message) + '</div><button class="btn primary block mt" onclick="start()">Coba lagi</button><button class="btn block mt" onclick="logout()">Keluar</button></div></div>';
}
function checkSetup() {
  // formulir login langsung tampil; status setup dicek di latar belakang (sekaligus "membangunkan" Apps Script)
  var brand = ls.get('brand', null);
  if (brand) renderAuth('login', brand);
  else $('#app').innerHTML = '<div class="loading" style="min-height:100vh"><span class="spin"></span> Menghubungkan ke server…</div>';
  return api('setup.status').then(function (s) {
    ls.set('brand', Object.assign({}, brand || {}, { storeName: s.storeName }));
    if (s.needsSetup) return renderAuth('setup', s);
    if (!brand || !$('#fLogin')) renderAuth('login', s);
  }, function (e) {
    if (!$('#fLogin')) renderAuth('login', brand);
    $('#authMsg').innerHTML = '<div class="alert warn">Server tidak dapat dihubungi: ' + esc(e.message) + '</div>';
  });
}

function findByCode(code) {
  code = String(code).trim();
  var list = st.boot.products || [];
  var hit = list.filter(function (p) { return p.active && (p.barcode === code || p.sku === code || String(p.barcodes || '').split(',').indexOf(code) >= 0); })[0];
  if (!hit) {
    // dukung barcode timbangan EAN-13 berawalan 2 (kode PLU 5 digit + berat gram)
    var m = /^2(\d)(\d{5})(\d{5})\d$/.exec(code);
    if (m) { var plu = m[2]; hit = list.filter(function (p) { return p.active && (p.sku === plu || p.barcode === plu); })[0]; if (hit) return { p: hit, qty: Number(m[3]) / 1000 }; }
  }
  return hit ? { p: hit, qty: 1 } : null;
}
function addByCode(code, fromSearch) {
  var r = findByCode(code);
  if (!r) {
    if (st.device.sound) beep(false);
    if (!fromSearch) toast('Barcode ' + code + ' tidak terdaftar', 'bad');
    else {
      var q = String(code).toLowerCase();
      var hits = (st.boot.products || []).filter(function (p) { return p.active && p.name.toLowerCase().indexOf(q) >= 0; });
      if (hits.length === 1) { addToCart(hits[0].id, 1); return true; }
      if (!hits.length) toast('Produk "' + code + '" tidak ditemukan', 'bad');
    }
    return false;
  }
  addToCart(r.p.id, r.qty);
  return true;
}
function addToCart(pid, qty) {
  var p = prodMap()[pid];
  if (!p) return;
  var line = st.cart.items.filter(function (i) { return i.productId === pid && !i.isCustom && !i.discManual; })[0];
  var cur = st.cart.items.filter(function (i) { return i.productId === pid; }).reduce(function (a, i) { return a + Number(i.qty); }, 0);
  if (!st.boot.settings.allowNegativeStock && cur + qty > (Number(p.stock) || 0)) {
    toast('Stok ' + p.name + ' tersisa ' + qtyFmt(p.stock) + ' — tetap ditambahkan (cek fisik)', 'warn');
  }
  if (line) line.qty = Math.round((Number(line.qty) + qty) * 1000) / 1000;
  else st.cart.items.push({ productId: pid, qty: qty });
  if (st.device.sound) beep(true);
  vibrate(15);
  saveCart(); renderCart(); renderProducts();
}
function changeQty(idx, d) {
  var it = st.cart.items[idx];
  if (!it) return;
  it.qty = Math.round((Number(it.qty) + d) * 1000) / 1000;
  if (it.qty <= 0) {
    st.cart.items.splice(idx, 1);
    st.cart.approvals = {};

  saveCart(); renderCart(); renderProducts();
}

    (c.promos.length ? '<div class="faint" style="font-size:11.5px">' + c.promos.map(esc).join(' · ') + '</div>' : '') +
    (c.taxTotal ? '<div class="sumrow"><span>PPN ' + c.taxRate + '% ' + (c.taxMode === 'INCLUSIVE' ? '(termasuk)' : '') + '</span><b>' + rp(c.taxTotal) + '</b></div>' : '') +
    (c.rounding ? '<div class="sumrow"><span>Pembulatan</span><b>' + rp(c.rounding) + '</b></div>' : '') +
    '<div class="sumrow total"><span>Total</span><span class="num">' + rp(c.grandTotal) + '</span></div>' +
    '<button class="btn primary lg block" onclick="startPayment()"' + (st.cart.items.length ? '' : ' disabled') + '>' + ic('cash') + 'Bayar ' + rp(c.grandTotal) + '</button></div>';
  return head + body + foot;
}
function bindCartLines(root) {
  $$('.cline', root).forEach(function (row) { row.onclick = function () { editLine(Number(row.dataset.i)); }; });
}
function renderCart() {
  var c = calcNow();

  var bar = $('#cartBar');
  if (bar) { bar.innerHTML = ic('cart') + '<span>' + qtyFmt(c.totalQty) + ' item</span><span class="t">' + rp(c.grandTotal) + '</span>'; bar.style.display = st.cart.items.length ? '' : 'none'; }
  var sheet = $('#cartSheetBody');
  if (sheet) { sheet.innerHTML = cartHtml(c); bindCartLines(sheet); }
  return c;
}
function openCartSheet() {
  var m = modal({ title: '', size: 'full', body: '<div id="cartSheetBody" class="card cart" style="position:static;max-height:none;box-shadow:none;border:0"></div>', onClose: function () { renderCart(); } });
  m.el.querySelector('.md-b').style.padding = '0';
  renderCart();
}
function clearCart(silent) {
  var go = function () { st.cart = { items: [], customer: null, pointsUsed: 0, approvals: {}, note: '' }; saveCart(); renderCart(); renderProducts(); closeCartSheet(); };
  if (silent) return go();
  confirmBox('Kosongkan keranjang?', 'Semua item akan dihapus.', 'Kosongkan', true).then(function (y) { if (y) go(); });
}
function closeCartSheet() { var s = $('#cartSheetBody'); if (s) { var ov = s.closest('.ov'); modalStack.filter(function (m) { return m.el === ov; }).forEach(function (m) { m.close(); }); } }

/* ---------- Ubah baris: qty, harga nego, diskon manual ---------- */
function editLine(idx) {
  var it = st.cart.items[idx]; if (!it) return;
  var p = prodMap()[it.productId];
  var floor = Number(p.minPrice) > 0 ? Number(p.minPrice) : Number(p.cost);
  var cur = it.isCustom ? Number(it.unitPrice) : Number(p.price);
  var maxPct = Number(st.boot.settings.maxCashierDiscPct) || 0;
  var approver = ['SUPER_ADMIN', 'COMPANY_ADMIN', 'AREA_MANAGER', 'STORE_MANAGER'].indexOf(st.user.role) >= 0;
  var m = modal({
    title: esc(p.name),
    body: '<div class="col gap-lg"><div class="row between"><span class="muted">Harga normal</span><b>' + rp(p.price) + '</b></div>' +
      '<label class="f">Jumlah (' + esc(p.unit) + ')<input class="input big" id="lq" inputmode="decimal" value="' + qtyFmt(it.qty) + '"></label>' +
      '<label class="f">Harga jual kesepakatan / satuan (tawar-menawar)<input class="input big" id="lp" inputmode="numeric" value="' + cur + '"></label>' +
      '<div class="quick">' + [0, 2, 5, 10].map(function (pct) { return '<button class="btn sm" data-pct="' + pct + '">' + (pct ? '-' + pct + '%' : 'Normal') + '</button>'; }).join('') +
      '<button class="btn sm" data-round="500">Bulat 500</button><button class="btn sm" data-round="1000">Bulat 1rb</button></div>' +
      '<label class="f">Alasan harga nego<input class="input" id="lr" value="' + esc(it.customReason || '') + '" placeholder="mis. pelanggan grosir, kemasan penyok"></label>' +
      '<label class="f">Diskon manual (Rp) untuk baris ini<input class="input" id="ld" inputmode="numeric" value="' + (it.discManual || 0) + '"></label>' +
      '<div class="alert" id="lhint" style="font-size:12.5px"></div></div>',
    foot: '<button class="btn danger" id="lDel">' + ic('trash') + 'Hapus</button><span class="grow"></span><button class="btn" data-close>Batal</button><button class="btn primary" id="lOk">Terapkan</button>'
  });
  var hint = function () {
    var price = num(m.$('#lp').value), disc = num(m.$('#ld').value), q = num(m.$('#lq').value) || 1;
    var msgs = [];
    if (price !== Number(p.price)) msgs.push('Selisih nego ' + rp(price - p.price) + '/satuan (' + Math.round((price - p.price) / p.price * 100) + '%). Promo otomatis tidak berlaku untuk harga nego.');
    if (price < floor) msgs.push('<b style="color:var(--bad)">Di bawah harga minimum ' + rp(floor) + ' → wajib PIN supervisor' + (approver ? ' (Anda berwenang)' : '') + '.</b>');
    if (disc > 0 && disc / (price * q) * 100 > maxPct) msgs.push('<b style="color:var(--warn)">Diskon ' + Math.round(disc / (price * q) * 100) + '% melebihi batas kasir ' + maxPct + '% → wajib PIN supervisor' + (approver ? ' (Anda berwenang)' : '') + '.</b>');
    m.$('#lhint').innerHTML = msgs.join('<br>') || 'Harga normal tanpa diskon tambahan.';
  };
  ['#lp', '#ld', '#lq'].forEach(function (s) { m.$(s).oninput = hint; });
  m.$$('[data-pct]').forEach(function (b) { b.onclick = function () { m.$('#lp').value = Math.round(p.price * (100 - Number(b.dataset.pct)) / 100); hint(); }; });
  m.$$('[data-round]').forEach(function (b) { b.onclick = function () { var r = Number(b.dataset.round); m.$('#lp').value = Math.floor(num(m.$('#lp').value) / r) * r; hint(); }; });
  hint();
  m.$('#lDel').onclick = function () { st.cart.items.splice(idx, 1); st.cart.approvals = {}; saveCart(); m.close(); renderCart(); renderProducts(); };
  m.$('#lOk').onclick = function () {
    var q = num(m.$('#lq').value), price = Math.round(num(m.$('#lp').value));
    if (q <= 0) return toast('Jumlah harus lebih dari 0', 'bad');
    if (price < 0) return toast('Harga tidak valid', 'bad');
    it.qty = q;
    if (price !== Number(p.price)) { it.isCustom = true; it.unitPrice = price; it.customReason = m.$('#lr').value.trim() || 'Tawar-menawar'; }
    else { delete it.isCustom; delete it.unitPrice; delete it.customReason; }
    it.discManual = Math.max(0, Math.round(num(m.$('#ld').value)));
    delete st.cart.approvals[idx];
    saveCart(); m.close(); renderCart(); renderProducts();
  };
}

/* ---------- PIN supervisor ---------- */
function askSupervisor(reasons, action, amount) {
  return new Promise(function (resolve) {
    var m = modal({
      title: ic('lock') + ' Otorisasi Supervisor',
      body: '<div class="alert warn" style="font-size:13px">' + reasons.map(esc).join('<br>') + '</div>' +
        '<label class="f mt">PIN supervisor (6 digit)<input class="input big mono" id="spin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" autofocus style="text-align:center;letter-spacing:.4em"></label>' +
        (st.online ? '' : '<p class="faint" style="font-size:12px">Perangkat offline: PIN disimpan sementara dan diverifikasi server saat sinkron. PIN yang salah akan ditandai KRITIS di audit.</p>'),
      foot: '<button class="btn" data-close>Batal</button><button class="btn primary" id="spOk">Setujui</button>',
      onClose: function (v) { resolve(v || null); }
    });
    var submit = function () {
      var pin = m.$('#spin').value.trim();
      if (!/^\d{4,8}$/.test(pin)) return toast('PIN tidak valid', 'bad');
      if (!st.online) return m.close({ pin: pin, offline: true });
      run(m.$('#spOk'), api('pin.verify', { pin: pin, outletId: st.outletId, action: action, amount: amount })).then(function (r) {
        toast('Disetujui oleh ' + r.supervisorName, 'ok');
        m.close({ token: r.approvalToken, name: r.supervisorName });
      }, function (e) { if (e.network) m.close({ pin: pin, offline: true }); else { m.$('#spin').value = ''; m.$('#spin').focus(); } });
    };
    m.$('#spOk').onclick = submit;
    m.$('#spin').onkeydown = function (e) { if (e.key === 'Enter') submit(); };
  });
}

/* ---------- Member ---------- */

/* ---------- Tahan transaksi ---------- */
function holdCart() {
  if (!st.cart.items.length) return;
  var label = (st.cart.customer ? st.cart.customer.name : 'Pelanggan') + ' · ' + fmtT(new Date().toISOString());
  st.held.push({ id: uuid(), label: label, at: new Date().toISOString(), outletId: st.outletId, cart: st.cart, total: calcNow().grandTotal });

  clearCart(true);
  toast('Transaksi ditahan: ' + label, 'ok');
  if ($('.pos')) VIEWS.pos($('#view'));
}
function showHeld() {
  var list = st.held.filter(function (h) { return h.outletId === st.outletId; });
  var m = modal({
    title: 'Transaksi Ditahan', body: list.length ? list.map(function (h) {
      return '<div class="list-item"><div class="grow"><b>' + esc(h.label) + '</b><div class="faint" style="font-size:12px">' + h.cart.items.length + ' baris · ' + rp(h.total) + '</div></div>' +
        '<button class="btn sm primary" data-r="' + h.id + '">Lanjutkan</button><button class="btn sm icon danger" data-d="' + h.id + '">' + ic('trash', 'sm') + '</button></div>';

  });

/* ---------- Pembayaran ---------- */
function startPayment() {
  var c = calcNow();
  if (!c.items.length) return;
  var approver = ['SUPER_ADMIN', 'COMPANY_ADMIN', 'AREA_MANAGER', 'STORE_MANAGER'].indexOf(st.user.role) >= 0;
  var pending = approver ? [] : c.needsApproval.filter(function (n) { return !st.cart.approvals[n.idx]; });
  if (pending.length) {
    return askSupervisor(pending.map(function (n) { return n.detail; }), 'HARGA_DISKON', c.grandTotal).then(function (a) {
      if (!a) return;
      pending.forEach(function (n) { st.cart.approvals[n.idx] = a; });
      saveCart(); renderCart(); startPayment();
    });
  }
  closeCartSheet();
  openPayModal();
}

function openPayModal() {
  var pays = [];
  var method = 'CASH';
  var cust = st.cart.customer;
  var S = st.boot.settings;
  var M = [['CASH', 'Tunai', 'cash'], ['QRIS', 'QRIS', 'qr'], ['DEBIT', 'Debit', 'card'], ['CREDIT', 'Kredit', 'card'], ['TRANSFER', 'Transfer', 'bank']];
  var m = modal({
    title: 'Pembayaran', size: 'wide', sticky: true,
    body: '<div class="paytotal"><div class="l">Total tagihan</div><div class="v" id="pTotal"></div><div class="faint" id="pSub" style="font-size:12px"></div></div>' +
      (cust && Number(S.pointValue) > 0 ? '<div class="alert ok row between"><span>' + ic('star', 'sm') + ' ' + esc(cust.name) + ' punya <b>' + (cust.points || 0) + '</b> poin (1 poin = ' + rp(S.pointValue) + ')</span><span class="row"><input class="input" id="pPts" type="number" min="0" max="' + (cust.points || 0) + '" value="' + (st.cart.pointsUsed || 0) + '" style="width:90px;min-height:34px"><button class="btn sm" id="pPtsMax">Maks</button></span></div>' : '') +
      '<div class="methods mt" id="pM">' + M.map(function (x) { return '<button data-m="' + x[0] + '">' + ic(x[2]) + x[1] + '</button>'; }).join('') + '</div>' +
      '<div id="pQris" class="center mt hidden">' + (S.qrisImage ? '<img alt="QRIS" src="' + esc(S.qrisImage) + '" style="max-width:220px;width:100%;border-radius:10px;border:1px solid var(--line)"><div class="faint" style="font-size:12px">Minta pelanggan scan QRIS, lalu cek notifikasi dana masuk sebelum konfirmasi.</div>' : '<div class="alert warn">Gambar QRIS statis belum diunggah (Pengaturan › Pembayaran).</div>') + '</div>' +
      '<div class="grid2 mt"><label class="f">Nominal diterima<input class="input big" id="pAmt" inputmode="numeric"></label><label class="f" id="pRefW">No. referensi / approval code<input class="input" id="pRef" placeholder="opsional"></label></div>' +
      '<div class="quick mt" id="pQuick"></div>' +
      '<div class="mt" id="pList"></div>' +
      '<div class="row between mt"><span class="muted">Kembalian</span><span class="change" id="pChange">Rp0</span></div>' +
      '<label class="f mt">Catatan (opsional)<input class="input" id="pNote" value="' + esc(st.cart.note || '') + '"></label>',
    foot: '<button class="btn" data-close>Kembali</button><button class="btn" id="pSplit">' + ic('plus') + 'Tambah bayar (split)</button><button class="btn primary lg" id="pDone">' + ic('check') + 'Selesaikan</button>'
  });
  var c;
  var paid = function () { return pays.reduce(function (a, p) { return a + p.amount; }, 0); };
  var refresh = function () {
    var pts = m.$('#pPts');
    st.cart.pointsUsed = pts ? Math.max(0, Math.min(Number(pts.value) || 0, cust.points || 0)) : 0;
    c = calcNow();
    if (pts && c.pointsUsed !== st.cart.pointsUsed) { st.cart.pointsUsed = c.pointsUsed; pts.value = c.pointsUsed; }
    m.$('#pTotal').textContent = rp(c.grandTotal);
    m.$('#pSub').textContent = c.items.length + ' baris · ' + qtyFmt(c.totalQty) + ' item' + (c.discountTotal ? ' · hemat ' + rp(c.discountTotal) : '') + (c.taxTotal ? ' · PPN ' + rp(c.taxTotal) : '');
    var remain = Math.max(0, c.grandTotal - paid());
    var q = [remain];
    [2000, 5000, 10000, 20000, 50000, 100000].forEach(function (d) { var v = Math.ceil(remain / d) * d; if (v > remain && q.indexOf(v) < 0) q.push(v); });
    q = q.slice(0, 6);
    m.$('#pQuick').innerHTML = method === 'CASH' ? q.map(function (v, i) { return '<button class="btn" data-v="' + v + '">' + (i === 0 ? 'Uang pas' : rp(v)) + '</button>'; }).join('') : '';
    m.$$('#pQuick [data-v]').forEach(function (b) { b.onclick = function () { m.$('#pAmt').value = b.dataset.v; calcChange(); }; });
    m.$$('#pM button').forEach(function (b) { b.classList.toggle('on', b.dataset.m === method); });
    m.$('#pQris').classList.toggle('hidden', method !== 'QRIS');
    m.$('#pRefW').classList.toggle('hidden', method === 'CASH');
    if (!m.$('#pAmt').value || method !== 'CASH') m.$('#pAmt').value = remain;
    m.$('#pList').innerHTML = pays.length ? '<div class="tbl-wrap"><table class="tbl"><tbody>' + pays.map(function (p, i) {
      return '<tr><td>' + esc(p.label) + (p.ref ? ' <span class="faint mono">' + esc(p.ref) + '</span>' : '') + '</td><td class="right num">' + rp(p.amount) + '</td><td class="right"><button class="btn sm icon ghost" data-rm="' + i + '">' + ic('x', 'sm') + '</button></td></tr>';
    }).join('') + '</tbody></table></div>' : '';
    m.$$('[data-rm]').forEach(function (b) { b.onclick = function () { pays.splice(Number(b.dataset.rm), 1); m.$('#pAmt').value = ''; refresh(); }; });
    calcChange();
  };
  var calcChange = function () {
    var amt = num(m.$('#pAmt').value);
    var total = paid() + amt;
    var ch = total - c.grandTotal;
    m.$('#pChange').textContent = ch >= 0 ? rp(ch) : 'Kurang ' + rp(-ch);
    m.$('#pChange').style.color = ch >= 0 ? 'var(--ok)' : 'var(--bad)';
    m.$('#pDone').disabled = ch < 0;
  };
  var addCurrent = function () {
    var amt = Math.round(num(m.$('#pAmt').value));
    if (amt <= 0) return false;
    var remain = c.grandTotal - paid();
    if (method !== 'CASH' && amt > remain) { toast('Pembayaran non-tunai tidak boleh melebihi sisa tagihan ' + rp(remain), 'bad'); return null; }
    var lab = M.filter(function (x) { return x[0] === method; })[0][1];
    pays.push({ method: method, label: lab, amount: amt, ref: method === 'CASH' ? '' : m.$('#pRef').value.trim() });
    m.$('#pRef').value = '';
    return true;
  };
  m.$$('#pM button').forEach(function (b) { b.onclick = function () { method = b.dataset.m; m.$('#pAmt').value = ''; refresh(); }; });
  m.$('#pAmt').oninput = calcChange;
  m.$('#pAmt').onkeydown = function (e) { if (e.key === 'Enter') m.$('#pDone').click(); };
  var pts = m.$('#pPts'); if (pts) { pts.oninput = refresh; m.$('#pPtsMax').onclick = function () { pts.value = cust.points || 0; refresh(); }; }
  m.$('#pSplit').onclick = function () { if (addCurrent()) { m.$('#pAmt').value = ''; method = 'CASH'; refresh(); } };
  m.$('#pDone').onclick = function () {
    var r = addCurrent();
    if (r === null) return;
    if (paid() < c.grandTotal) { toast('Pembayaran kurang', 'bad'); return; }
    st.cart.note = m.$('#pNote').value.trim();
    m.close();
    finishSale(c, pays);
  };
  refresh();
  setTimeout(function () { var a = m.$('#pAmt'); if (a && matchMedia('(min-width:900px)').matches) { a.focus(); a.select(); } }, 80);
}

function nextReceiptNo() {
  var o = outlet();
  var p = dparts();
  var ymd = p.year.slice(2) + p.month + p.day;
  var key = 'seq.' + st.outletId + '.' + st.device.register + '.' + ymd;
  var n = (ls.get(key, 0) || 0) + 1;
  ls.set(key, n);
  return (o.code || 'TK') + '-' + st.device.register + '-' + ymd + '-' + String(n).padStart(4, '0');
}

function finishSale(c, pays) {
  var paid = pays.reduce(function (a, p) { return a + p.amount; }, 0);
  var change = paid - c.grandTotal;
  var sale = {
    id: uuid(), receiptNo: nextReceiptNo(), outletId: st.outletId, shiftId: st.shift.id, register: st.device.register,
    cashierId: st.user.id, cashierName: st.user.fullName, createdAt: new Date().toISOString(),
    customerId: st.cart.customer ? st.cart.customer.id : '', customer: st.cart.customer && /^CUS-/.test(st.cart.customer.id) ? st.cart.customer : undefined,
    pointsUsed: c.pointsUsed, items: c.items.map(function (i) { return { productId: i.productId, qty: i.qty, unitPrice: i.unitPrice, isCustom: i.isCustom, customReason: i.customReason, discManual: i.discManual }; }),
    payments: pays.map(function (p) { return { method: p.method, amount: p.amount, ref: p.ref }; }),
    grandTotal: c.grandTotal, offline: !st.online, notes: st.cart.note,
    approvals: {}, calc: { grossSubtotal: c.grossSubtotal, discountTotal: c.discountTotal, taxBase: c.taxBase, taxTotal: c.taxTotal, rounding: c.rounding, grandTotal: c.grandTotal, promos: c.promos }
  };
  Object.keys(st.cart.approvals).forEach(function (k) { var a = st.cart.approvals[k]; sale.approvals[k] = a.token ? { token: a.token } : { pin: a.pin }; });
  // catatan lokal untuk struk & cetak ulang
  var local = {
    id: sale.id, receiptNo: sale.receiptNo, createdAt: sale.createdAt, outletId: sale.outletId, cashierName: st.user.fullName, register: sale.register,
    customer: st.cart.customer ? { name: st.cart.customer.name, phone: st.cart.customer.phone, points: st.cart.customer.points } : null,
    items: c.items, calc: c, payments: pays, paid: paid, change: change, synced: false, notes: sale.notes
  };
  st.localSales.unshift(local); st.localSales = st.localSales.slice(0, 300);
  kv.set('localSales', st.localSales);
  // stok & shift lokal
  var pm = prodMap();
  c.items.forEach(function (i) { if (pm[i.productId]) pm[i.productId].stock = (Number(pm[i.productId].stock) || 0) - i.qty; });
  var cashNet = pays.filter(function (p) { return p.method === 'CASH'; }).reduce(function (a, p) { return a + p.amount; }, 0) - change;
  st.shift.cashSales = (Number(st.shift.cashSales) || 0) + Math.max(0, cashNet);

/* ---------- Pemindai kamera ---------- */
function openScanner(onCode, continuous) {
  var stream = null, stop = false, lastCode = '', lastAt = 0, zx = null;
  var m = modal({
    title: 'Scan Barcode', body: '<div class="video-box"><video id="sv" playsinline muted></video><div class="aim"></div></div><div class="faint center mt" id="sMsg" style="font-size:12.5px">Arahkan barcode ke kotak hijau</div>' +
      '<div class="row mt"><input class="input" id="sManual" placeholder="atau ketik kode lalu Enter" inputmode="numeric"><button class="btn" id="sAdd">OK</button></div>',
    onClose: function () { stop = true; if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); if (zx && zx.reset) try { zx.reset(); } catch (e) { } }
  });
  var hit = function (code) {
    var now = Date.now();
    if (code === lastCode && now - lastAt < 1500) return;
    lastCode = code; lastAt = now;
    var r = onCode(code);
    if (r !== false && !continuous) m.close();
    else m.$('#sMsg').textContent = 'Terbaca: ' + code;
  };
  m.$('#sAdd').onclick = function () { var v = m.$('#sManual').value.trim(); if (v) { m.$('#sManual').value = ''; hit(v); } };
  m.$('#sManual').onkeydown = function (e) { if (e.key === 'Enter') m.$('#sAdd').click(); };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { m.$('#sMsg').textContent = 'Kamera tidak tersedia di browser/konteks ini. Gunakan scanner USB/Bluetooth atau ketik kode. (Kamera berfungsi pada versi PWA/HTTPS.)'; return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false }).then(function (s) {
    stream = s;
    var v = m.$('#sv'); v.srcObject = s; v.play();
    if ('BarcodeDetector' in window) {
      var det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'qr_code', 'itf'] });
      var loop = function () {
        if (stop) return;
        det.detect(v).then(function (codes) { if (codes.length) hit(codes[0].rawValue); }).catch(function () { }).then(function () { if (!stop) setTimeout(loop, 180); });
      };
      loop();
    } else {
      m.$('#sMsg').textContent = 'Memuat pemindai…';
      loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js').then(function () {
        zx = new ZXing.BrowserMultiFormatReader();
        m.$('#sMsg').textContent = 'Arahkan barcode ke kotak hijau';
        zx.decodeFromStream(s, v, function (res) { if (res && !stop) hit(res.getText()); });
      }, function () { m.$('#sMsg').textContent = 'Pemindai kamera tidak tersedia offline. Ketik kode secara manual.'; });
    }
  }, function (e) { m.$('#sMsg').textContent = 'Izin kamera ditolak / tidak tersedia: ' + e.message; });
}
var scriptCache = {};
function loadScript(src) {
  if (scriptCache[src]) return scriptCache[src];
  scriptCache[src] = new Promise(function (res, rej) {
    var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function () { delete scriptCache[src]; rej(new Error('Gagal memuat ' + src)); };
    document.head.appendChild(s);
  });
  return scriptCache[src];
}

(function () {
  var buf = '', last = 0;
  document.addEventListener('keydown', function (e) {
    if (st.view !== 'pos' || modalStack.length || !$('.pos')) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
    var now = Date.now();
    if (now - last > 60) buf = '';
    last = now;
    if (e.key === 'Enter') { if (buf.length >= 4) { addByCode(buf); e.preventDefault(); } buf = ''; return; }
    if (e.key.length === 1) buf += e.key;
    if (e.key === 'F2') { e.preventDefault(); var s = $('#posSearch'); if (s) s.focus(); }
    if (e.key === 'F9' && st.cart.items.length) { e.preventDefault(); startPayment(); }
  });
})();

function thumbOf(p) {

function initials(name) {

}
/** Ganti placeholder dengan gambar setelah thumbnail tiba (tanpa render ulang halaman). */
function paintThumbs() {
  var pm = prodMap();
  $$('[data-thumb]').forEach(function (el) {
    var t = thumbOf(pm[el.dataset.thumb]);
    if (!t) return;
    var img = el.querySelector('img');
    if (img) { if (img.getAttribute('src') !== t) img.src = t; return; }
    var b = el.querySelector('b'); if (b) b.remove();
    img = document.createElement('img'); img.alt = ''; img.src = t;
    el.insertBefore(img, el.firstChild);
  });
}

/** Ambil thumbnail yang belum ada / versinya berubah, simpan di IndexedDB agar tampil saat offline. */
function syncThumbs() {
  if (!st.boot || !st.token || syncThumbs.busy) return;
  var prods = st.boot.products || [];
  var alive = {};
  prods.forEach(function (p) { if (p.photoVer) alive[p.id] = 1; });
  var changed = false;
  Object.keys(thumbs).forEach(function (id) { if (!alive[id]) { delete thumbs[id]; changed = true; } });
  if (changed) kv.set('thumbs', thumbs);
  if (!st.online || !photosOn()) return;
  var need = prods.filter(function (p) { return p.photoVer && !thumbOf(p); }).map(function (p) { return p.id; });
  if (!need.length) return;
  syncThumbs.busy = true;
  var verOf = {}; prods.forEach(function (p) { verOf[p.id] = p.photoVer; });
  var next = function () {
    var batch = need.splice(0, 60);
    if (!batch.length) { syncThumbs.busy = false; return; }
    api('photos.thumbs', { ids: batch }).then(function (map) {
      Object.keys(map).forEach(function (id) { if (map[id]) thumbs[id] = { v: verOf[id], d: map[id] }; });
      kv.set('thumbs', thumbs);
      paintThumbs();
      next();
    }, function () { syncThumbs.busy = false; });
  };
  next();
}

/* ---------- Kompres gambar di perangkat sebelum diunggah ---------- */
function resizeImage(file, max, quality) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onerror = function () { rej(new Error('Gagal membaca file gambar')); };
    r.onload = function () {
      var img = new Image();
      img.onerror = function () { rej(new Error('File bukan gambar yang valid')); };
      img.onload = function () {
        var s = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
        var g = c.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);   // latar putih untuk PNG transparan
        g.drawImage(img, 0, 0, c.width, c.height);
        res({ canvas: c, url: c.toDataURL('image/jpeg', quality) });
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
/** Hasil: {full: ≤ ±1 MB (800 px), thumb: < 40.000 karakter (240 px)} */
function preparePhoto(file) {
  if (!file || !/^image\//.test(file.type)) return Promise.reject(new Error('Pilih file gambar (JPG/PNG/WebP)'));
  return resizeImage(file, 900, 0.82).then(function (full) {
    var f = full.url;
    if (f.length > 1400000) f = full.canvas.toDataURL('image/jpeg', 0.6);
    var size = 240, q = 0.72, t;
    var tc = document.createElement('canvas');
    do {
      var sc = Math.min(1, size / Math.max(full.canvas.width, full.canvas.height));
      tc.width = Math.round(full.canvas.width * sc); tc.height = Math.round(full.canvas.height * sc);
      var g = tc.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, tc.width, tc.height);
      g.drawImage(full.canvas, 0, 0, tc.width, tc.height);
      t = tc.toDataURL('image/jpeg', q);
      q -= 0.12; if (q < 0.35) { size -= 40; q = 0.6; }
    } while (t.length > 40000 && size > 80);
    return { full: f, thumb: t };
  });
}

/* ---------- Penampil zoom (cubit, scroll, seret, ketuk ganda) ---------- */
function zoomPhoto(pid, opt) {
  opt = opt || {};

  if (!p) return;
  var startSrc = opt.src || thumbOf(p);
  var m = modal({
    title: esc(p.name), size: 'xl',
    body: '<div class="zoomer" id="zm">' + (startSrc ? '<img id="zmImg" alt="" draggable="false" src="' + startSrc + '">' : '') + '<div class="zm-msg" id="zmMsg">' + (startSrc ? '' : '<span class="spin"></span>') + '</div>' +
      '<div class="zm-ctl"><button class="btn icon sm" data-zm="-" aria-label="Perkecil">' + ic('minus', 'sm') + '</button><span id="zmPct">100%</span><button class="btn icon sm" data-zm="+" aria-label="Perbesar">' + ic('plus', 'sm') + '</button><button class="btn sm" data-zm="0">Reset</button></div></div>' +
      '<div class="row between mt"><div><b>' + rp(p.price) + '</b> <span class="faint">/ ' + esc(p.unit || '') + ' · stok ' + qtyFmt(p.stock) + ' · ' + esc(p.sku || '') + '</span></div>' +
      (opt.onAdd ? '<button class="btn primary" id="zmAdd">' + ic('plus') + 'Tambah ke keranjang</button>' : '') + '</div>' +
      '<div class="faint" style="font-size:12px;margin-top:6px">Cubit / scroll untuk zoom, seret untuk menggeser, ketuk dua kali untuk perbesar cepat.</div>'
  });
  var box = m.$('#zm'), S = { s: 1, x: 0, y: 0 }, pts = {}, pinch = null, last = null, lastTap = 0;
  var img = function () { return m.$('#zmImg'); };

    S.s = Math.max(1, Math.min(6, S.s));
    var w = box.clientWidth, h = box.clientHeight;
    var mx = (S.s - 1) * w / 2, my = (S.s - 1) * h / 2;
    S.x = Math.max(-mx, Math.min(mx, S.x)); S.y = Math.max(-my, Math.min(my, S.y));
    if (S.s === 1) { S.x = 0; S.y = 0; }
  };
  var apply = function () {
    clamp();
    var i = img(); if (i) i.style.transform = 'translate(' + S.x + 'px,' + S.y + 'px) scale(' + S.s + ')';
    m.$('#zmPct').textContent = Math.round(S.s * 100) + '%';
    box.style.cursor = S.s > 1 ? 'grab' : 'zoom-in';
  };
  var zoomAt = function (factor, cx, cy) {
    var r = box.getBoundingClientRect();
    var ox = (cx === undefined ? r.width / 2 : cx - r.left) - r.width / 2, oy = (cy === undefined ? r.height / 2 : cy - r.top) - r.height / 2;
    var ns = Math.max(1, Math.min(6, S.s * factor)), k = ns / S.s;
    S.x = ox - (ox - S.x) * k; S.y = oy - (oy - S.y) * k; S.s = ns;
    apply();
  };
  box.addEventListener('wheel', function (e) { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX, e.clientY); }, { passive: false });
  box.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.zm-ctl')) return;          // tombol +/−/reset bukan gestur
    box.setPointerCapture(e.pointerId);
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pts);
    if (ids.length === 2) { var a = pts[ids[0]], b = pts[ids[1]]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: S.s }; }
    last = { x: e.clientX, y: e.clientY };
    var now = Date.now();
    if (ids.length === 1 && now - lastTap < 300) { if (S.s > 1) { S.s = 1; apply(); } else zoomAt(2.5, e.clientX, e.clientY); lastTap = 0; }
    else lastTap = now;
  });
  box.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pts);
    if (ids.length === 2 && pinch) {
      var a = pts[ids[0]], b = pts[ids[1]];
      var target = pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / (pinch.d || 1);
      zoomAt(target / S.s, (a.x + b.x) / 2, (a.y + b.y) / 2);
    } else if (ids.length === 1 && last && S.s > 1) {

  var add = m.$('#zmAdd'); if (add) add.onclick = function () { opt.onAdd(); m.close(); };
  var setSrc = function (src) {
    var i = img();
    if (!i) { i = document.createElement('img'); i.id = 'zmImg'; i.alt = ''; i.draggable = false; box.insertBefore(i, box.firstChild); }
    i.src = src; m.$('#zmMsg').innerHTML = ''; apply();
  };
  apply();

    if (startSrc) m.$('#zmMsg').innerHTML = '<span class="zm-note"><span class="spin"></span> memuat foto penuh…</span>';
    api('photos.full', { productId: pid }).then(function (r) {

function photoEditorHtml(p) {

  return '<div class="photo-edit"><div class="pe-prev" id="pePrev">' + (t ? '<img alt="" src="' + t + '">' : '<span>' + ic('image', 'lg') + '<br>Belum ada foto</span>') + '</div>' +
    '<div class="col" style="gap:6px"><b style="font-size:13px">Foto produk</b><span class="faint" style="font-size:12px">Dikompres otomatis (±800 px) dan disimpan di Google Drive. Thumbnail tersimpan di perangkat untuk mode offline.</span>' +
    '<div class="row wrap"><label class="btn sm">' + ic('upload', 'sm') + 'Ambil / pilih foto<input type="file" accept="image/*" id="peFile" hidden></label>' +
    '<button type="button" class="btn sm" id="peZoom"' + (t || p.photoVer ? '' : ' disabled') + '>' + ic('zoom', 'sm') + 'Perbesar</button>' +
    '<button type="button" class="btn sm danger" id="peDel"' + (p.photoVer ? '' : ' disabled') + '>' + ic('trash', 'sm') + 'Hapus</button></div><span class="faint" id="peMsg" style="font-size:12px"></span></div></div>';
}
/** Mengikat kontrol foto; mengembalikan fungsi commit(productId) yang dipanggil setelah produk tersimpan. */
function bindPhotoEditor(m, p) {
  var pending = null;   // {full, thumb} | {remove:true} | null
  var prev = m.$('#pePrev'), msg = m.$('#peMsg');
  m.$('#peFile').onchange = function () {
    var f = this.files[0]; if (!f) return;
    msg.textContent = 'Memproses foto…';
    preparePhoto(f).then(function (ph) {
      pending = ph;
      prev.innerHTML = '<img alt="" src="' + ph.thumb + '">';
      m.$('#peZoom').disabled = false; m.$('#peDel').disabled = false;
      msg.textContent = 'Foto baru siap (' + Math.round(ph.full.length * 0.75 / 1024) + ' KB). Tersimpan saat menekan Simpan.';
    }, function (e) { msg.textContent = e.message; });
  };
  m.$('#peZoom').onclick = function () {
    if (pending && pending.full) zoomPhoto(p.id || 'baru', { product: Object.assign({ name: m.$('[name=name]').value || 'Produk baru', price: num(m.$('[name=price]').value) }, p), src: pending.full });
    else if (p.id) zoomPhoto(p.id);
  };
  prev.onclick = function () { if (!m.$('#peZoom').disabled) m.$('#peZoom').click(); };
  m.$('#peDel').onclick = function () {
    pending = p.photoVer ? { remove: true } : null;
    prev.innerHTML = '<span>' + ic('image', 'lg') + '<br>Belum ada foto</span>';
    m.$('#peZoom').disabled = true; m.$('#peDel').disabled = true;
    msg.textContent = p.photoVer ? 'Foto akan dihapus saat menekan Simpan.' : '';
  };
  return function commit(productId) {
    if (!pending) return Promise.resolve(null);
    var payload = Object.assign({ productId: productId }, pending);
    return api('photos.save', payload).then(function (r) {
      var prod = prodMap()[productId];
      if (prod) { prod.photoId = r.photoId; prod.photoVer = r.photoVer; }
      if (pending.remove) { delete thumbs[productId]; kv.del('photo:' + productId); }
      else { thumbs[productId] = { v: r.photoVer, d: pending.thumb }; kv.set('photo:' + productId, { v: r.photoVer, d: pending.full }); }
      kv.set('thumbs', thumbs); saveBootCache();
      return r;
    });
  };
}

/* ---------- Daftar satuan (disimpan di Pengaturan, bisa ditambah/dihapus) ---------- */
function unitList() {
  var base = String(st.boot.settings.units || 'PCS').split(',').map(function (u) { return u.trim(); }).filter(Boolean);
  (st.boot.products || []).forEach(function (p) { var u = String(p.unit || '').toUpperCase(); if (u && base.indexOf(u) < 0) base.push(u); });
  return base;
}
function unitOptions(sel) {
  var list = unitList();
  sel = String(sel || '').toUpperCase();
  if (sel && list.indexOf(sel) < 0) list.push(sel);
  return list.map(function (u) { return '<option value="' + esc(u) + '"' + (u === sel ? ' selected' : '') + '>' + esc(u) + '</option>'; }).join('') +
    (can('settings.manage') ? '<option value="__new">+ Satuan baru…</option>' : '');
}
function saveUnits(list) {
  return api('settings.save', { units: list.join(',') }).then(function (s) { st.boot.settings = s; saveBootCache(); return s; });
}
function cleanUnit(u) { return String(u || '').trim().toUpperCase().replace(/\s+/g, ''); }
function addUnit() {
  return new Promise(function (res) {
    var m = modal({
      title: 'Satuan Baru', body: '<label class="f">Nama satuan (maks. 10 karakter, tanpa spasi)<input class="input" id="nuV" maxlength="10" placeholder="mis. KARTON, IKAT, SACHET" autofocus autocapitalize="characters"></label><p class="faint" style="font-size:12.5px">Satuan baru tersimpan di daftar dan bisa dipakai untuk produk lain.</p>',

    });

      var list = String(st.boot.settings.units || '').split(',').filter(Boolean);

function manageUnits() {

function validEan13(c) {
  if (!/^\d{13}$/.test(c)) return false;
  var s = 0; for (var i = 0; i < 12; i++) s += Number(c[i]) * (i % 2 ? 3 : 1);
  return (10 - s % 10) % 10 === Number(c[12]);
}
function printLabels() {
  var sel = {};
  var m = modal({
